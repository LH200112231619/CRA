const WORD_BANKS=[
  {id:"med",name:"医学英语词库",data:MED_WORDS},
  {id:"ielts",name:"雅思英语词库",data:IELTS_WORDS}
];
const WORD_MODES=[{id:"card",name:"翻转卡片"},{id:"choice",name:"选择题"},{id:"spell",name:"拼写测试"},{id:"listen",name:"听音选词"},{id:"review",name:"艾宾浩斯复习"}];
const WORD_INTERVALS=[0,1,3,7,14,30]; // stage 0..5 对应间隔天数
let wSession=null; // 当前学习会话
/* 元组转对象 */
function tuplesToWords(bank){
  return bank.data.map(t=>({word:t[0],phonetic:t[1],pos:t[2],meaning:t[3],example:t[4],exampleCN:t[5],level:t[6]||1}));
}
function wKey(bankId,w){return bankId+":"+w.word;}
function getWProg(bankId,w){return state.wordStudy.progress[wKey(bankId,w)];}
function ensureWProg(bankId,w){
  const k=wKey(bankId,w);
  return state.wordStudy.progress[k]||(state.wordStudy.progress[k]={stage:0,seen:0,correct:0,wrong:0,next:"",last:""});
}
function addDaysStr(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}
/* 构建词池（按筛选） */
function wordPool(){
  const ws=state.wordStudy;
  const bank=WORD_BANKS.find(b=>b.id===ws.bank)||WORD_BANKS[0];
  let words=tuplesToWords(bank);
  const letter=($("#wLetter")||{}).value, lv=($("#wLevel")||{}).value;
  if(letter)words=words.filter(w=>w.word[0].toLowerCase()===letter);
  if(lv)words=words.filter(w=>String(w.level)===lv);
  return {bank,words};
}
/* 统计 */
function wordStats(){
  const ws=state.wordStudy, bank=WORD_BANKS.find(b=>b.id===ws.bank)||WORD_BANKS[0];
  let learned=0,mastered=0,due=0,correct=0,wrong=0;
  tuplesToWords(bank).forEach(w=>{
    const p=getWProg(bank.id,w);
    if(p){
      if(p.seen>0)learned++;
      if(p.stage>=5)mastered++;
      if(p.next&&p.next<=todayStr())due++;
      correct+=p.correct;wrong+=p.wrong;
    }
  });
  const acc=(correct+wrong)?Math.round(correct/(correct+wrong)*100):0;
  return {total:bank.data.length,learned,mastered,due,acc,today:ws.learnedDates[todayStr()]||0};
}

/* 开始一个会话：构造队列（到期优先，然后未学，补足每日目标） */
function startWordSession(mode){
  const ws=state.wordStudy;
  const {bank,words}=wordPool();
  const due=[],unseen=[],learning=[];
  words.forEach(w=>{
    const p=getWProg(bank.id,w);
    if(!p)unseen.push(w);
    else if(p.next&&p.next<=todayStr())due.push(w);
    else if(p.stage<5)learning.push(w);
  });
  let queue;
  if(mode==="review")queue=due;
  else if(mode==="daily"){
    // 每日新词：30 待复习 + 30 未学，交错排列避免疲劳
    const rev=due.slice(0,30),nw=unseen.slice(0,30);
    queue=[];const n=Math.max(rev.length,nw.length);
    for(let i=0;i<n;i++){if(rev[i])queue.push(rev[i]);if(nw[i])queue.push(nw[i]);}
  }
  else queue=due.concat(unseen,learning);
  const remain=Math.max(0,ws.dailyGoal-(ws.learnedDates[todayStr()]||0));
  if(mode!=="review"&&mode!=="daily")queue=queue.slice(0,Math.max(ws.dailyGoal,remain,20));
  if(!queue.length){wSession=null;$("#wArea").innerHTML=`<div class="empty">🎉 当前筛选条件下没有待学/待复习单词。</div>`;renderWords();return;}
  wSession={mode,bank,queue,idx:0,correct:0,wrong:0,flipped:false,opts:null,answered:false};
  renderWordItem();
}
function curWord(){return wSession.queue[wSession.idx];}
function markSeen(w){
  const ws=state.wordStudy;
  ws.learnedDates[todayStr()]=(ws.learnedDates[todayStr()]||0)+(wSession._seen&&wSession._seen[w.word]?0:1);
  wSession._seen=wSession._seen||{};wSession._seen[w.word]=true;
}
/* 评分：good 升阶，again 降阶/重置 */
function gradeWord(w,good){
  const p=ensureWProg(wSession.bank.id,w);
  p.seen++;markSeen(w);
  if(good){p.correct++;p.stage=Math.min(5,p.stage+1);wSession.correct++;}
  else{p.wrong++;p.stage=(p.stage>=2?p.stage-1:0);wSession.wrong++;}
  p.last=todayStr();p.next=addDaysStr(WORD_INTERVALS[p.stage]);
}
/* 渲染当前题目 */
function renderWordItem(){
  const w=curWord();if(!w)return finishSession();
  const area=$("#wArea");wSession.answered=false;wSession.flipped=false;
  const prog=`${wSession.idx+1}/${wSession.queue.length} · ✓${wSession.correct} ✗${wSession.wrong}`;
  let body="";
  if(wSession.mode==="card"){
    body=`<div class="wcard" id="wCard">
      <div class="wfront"><div class="wword">${w.word}</div><div class="muted">${w.phonetic} · ${w.pos}</div>
        <button class="sm" data-act="wSpeak">🔊 朗读</button></div>
      <div class="wback hide"><div class="wword">${w.meaning}</div>

    </div>

      <button class="btn" data-act="wGrade" data-id="1">模糊</button>
      <button class="btn ok" data-act="wGrade" data-id="2">认识</button>
    </div>`;
  }else if(wSession.mode==="choice"){
    body=choiceHtml(w,"meaning");
  }else if(wSession.mode==="listen"){
    body=choiceHtml(w,"audio");
  }else if(wSession.mode==="spell"){
    body=`<div class="wcard"><div class="muted">听发音，拼写单词（${w.pos}）</div>
      <button class="btn mts" data-act="wSpeak">🔊 播放</button>
      <input id="wSpellInput" class="winput mts" placeholder="输入英文单词" autocomplete="off">
      <div class="mts"><button class="btn" data-act="wSpellCheck">提交</button>
      <button class="sm ghost" data-act="wHint">提示首字母</button></div>
      <div id="wResult" class="mts"></div></div>`;
    setTimeout(()=>speak(w.word),300);
  }
  area.innerHTML=`<div class="small muted">${prog}</div>${body}`;
  if(wSession.mode==="listen")setTimeout(()=>speak(w.word),350);
}
/* 选择题 / 听音选词 */
function choiceHtml(w,kind){
  const pool=wSession.queue;
  const others=[];
  const all=tuplesToWords(wSession.bank);
  while(others.length<3){
    const c=all[Math.floor(Math.random()*all.length)];
    if(c.word!==w.word&&!others.find(o=>o.word===c.word))others.push(c);
  }
  const opts=others.concat(w).sort(()=>Math.random()-0.5);
  wSession.opts=opts;
  const prompt=kind==="audio"
    ?`<div class="muted">听发音，选择正确单词</div><button class="btn mts" data-act="wSpeak">🔊 播放</button>`
    :`<div class="wword">${w.meaning}</div><div class="small muted">${w.pos} · 选择对应英文</div>`;
  return `<div class="wcard">${prompt}
    <div class="grid grid2 mts">${opts.map(o=>`<button class="btn opt ghost" data-act="wChoice" data-id="${o.word}">${kind==="audio"?o.word:o.word}<div class="small muted">${kind==="audio"?"":o.phonetic}</div></button>`).join("")}</div>
    <div id="wResult" class="mts"></div></div>`;
}
function finishSession(){
  const total=wSession.correct+wSession.wrong;
  const acc=total?Math.round(wSession.correct/total*100):0;
  const result=`<div class="card center">
    <h3>本轮完成 🎉</h3>
    <p>共 ${wSession.queue.length} 词 · 正确 <b>${wSession.correct}</b> · 错误 <b>${wSession.wrong}</b> · 正确率 <b>${acc}%</b></p>
    <div class="row gap center"><button class="btn" data-act="wAgain">再来一轮</button>
    <button class="btn ghost" data-act="wBackStats">返回统计</button></div></div>`;
  wSession=null;saveState();renderWords();
  $("#wArea").innerHTML=result;
}
/* 处理选择题作答 */
function answerChoice(btn,chosenWord){
  if(wSession.answered)return;wSession.answered=true;
  const w=curWord(),ok=chosenWord===w.word;
  gradeWord(w,ok);
  document.querySelectorAll("#wArea .opt").forEach(o=>{
    o.disabled=true;
    if(o.dataset.id===w.word)o.classList.add("opt-right");
    else if(o.dataset.id===chosenWord)o.classList.add("opt-wrong");
  });
  $("#wResult").innerHTML=ok?`<span class="ok">✓ 正确：${w.word} ${w.phonetic} — ${w.meaning}</span>`
    :`<span class="danger">✗ 正确答案：${w.word} — ${w.meaning}</span>`;
  saveState();setTimeout(nextWord,1100);
}
function nextWord(){wSession.idx++;if(wSession&&wSession.idx<wSession.queue.length)renderWordItem();else finishSession();}
/* 卡片自评：0 不认识 / 1 模糊 / 2 认识 */
function gradeCard(r){
  const w=curWord();
  if(r===2)gradeWord(w,true);
  else if(r===0)gradeWord(w,false);
  else{
    const p=ensureWProg(wSession.bank.id,w);
    p.seen++;markSeen(w);p.stage=Math.max(1,p.stage);
    p.last=todayStr();p.next=addDaysStr(1);wSession.correct++;
  }
  saveState();setTimeout(nextWord,350);
}

/* 词库导入：CSV 或 JSON */
function parseCsvLine(line){
  const out=[];let cur="",q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c=='"'){if(q&&line[i+1]=='"'){cur+='"';i++;}else q=!q;}
    else if(c===','&&!q){out.push(cur);cur="";}
    else cur+=c;
  }
  out.push(cur);return out.map(s=>s.trim());
}

function ingestTextToBank(text,fileName){
  let items=[];
  const t=text.trim();
  if(t[0]==="["||t[0]==="{"){
    const data=JSON.parse(t);
    items=Array.isArray(data)?data:(data.words||[]);
  }else{
    const lines=t.split(/\r?\n/).filter(l=>l.trim());
    const start=(lines[0].toLowerCase().includes("word")&&lines[0].includes(","))?1:0;
    items=lines.slice(start).map(l=>{
      if(l.includes(",")){const c=parseCsvLine(l);
        return {word:c[0],phonetic:c[1],pos:c[2],meaning:c[3],example:c[4],exampleCN:c[5],level:c[6]||1};}
      const parts=l.split(/\t|\s{2,}/);
      return {word:(parts[0]||"").trim(),meaning:(parts[1]||"").trim(),level:1};
    });
  }
  const valid=items.filter(x=>x&&(typeof x==="string"||x.word))
    .map(x=>typeof x==="string"?{word:x,meaning:"",level:1}:x);
  const bank=WORD_BANKS.find(b=>b.id===state.wordStudy.bank);
  const exist=new Set(bank.data.map(t=>t[0].toLowerCase()));
  let n=0;
  valid.forEach(x=>{const w=String(x.word).trim();
    if(w&&!exist.has(w.toLowerCase())){
      bank.data.push([w,x.phonetic||"",x.pos||"",x.meaning||"",x.example||"",x.exampleCN||"",Number(x.level)||1]);
      exist.add(w.toLowerCase());n++;}});
  state.wordStudy.extraLoaded=(state.wordStudy.extraLoaded||0)+n;
  saveState();renderWords();
  return {n,total:bank.data.length};
}
async function fetchAndIngest(url){
  toast("正在拉取词源…");
  const res=await fetch(url);
  if(!res.ok)throw new Error("HTTP "+res.status);
  const text=await res.text();
  return ingestTextToBank(text,url);
}
function importWords(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const text=r.result;let items=[];
      if(file.name.toLowerCase().endsWith(".json")){
        const data=JSON.parse(text);
        items=Array.isArray(data)?data:(data.words||[]);
      }else{
        const lines=text.split(/\r?\n/).filter(l=>l.trim());
        const start=lines[0].toLowerCase().includes("word")?1:0;
        items=lines.slice(start).map(l=>{const c=parseCsvLine(l);
          return {word:c[0],phonetic:c[1],pos:c[2],meaning:c[3],example:c[4],exampleCN:c[5],level:c[6]||1};});
      }
      const valid=items.filter(x=>x&&x.word&&x.meaning);
      // 追加到当前词库（去重）
      const bank=WORD_BANKS.find(b=>b.id===state.wordStudy.bank);
      const exist=new Set(bank.data.map(t=>t[0].toLowerCase()));
      let n=0;
      valid.forEach(x=>{if(!exist.has(String(x.word).toLowerCase())){
        bank.data.push([x.word,x.phonetic||"",x.pos||"",x.meaning,x.example||"",x.exampleCN||"",Number(x.level)||1]);n++;}});
      state.wordStudy.extraLoaded=(state.wordStudy.extraLoaded||0)+n;
      saveState();renderWords();toast(`已导入 ${n} 个新词（当前词库共 ${bank.data.length} 词）`);
    }catch(err){toast("导入失败："+err.message);}
  };
  r.readAsText(file);
}

/* =====================================================================
 * 恢复预置数据（只补缺，不清用户数据）
 * ===================================================================== */
function restorePreset(){
  const d=defaultState();
  // 词块补缺
  const haveC={};state.chunks.forEach(c=>haveC[c.id]=true);
  d.chunks.forEach(c=>{if(!haveC[c.id])state.chunks.push(c);});
  // 外企题补缺
  const haveQ={};state.extQuestions.forEach(q=>haveQ[q.id]=true);
  d.extQuestions.forEach(q=>{if(!haveQ[q.id])state.extQuestions.push(q);});
  // 项目补缺（按名称）
  const haveP={};state.projects.forEach(p=>haveP[p.name]=true);
  d.projects.forEach(p=>{if(!haveP[p.name])state.projects.push(p);});
  // 法规补缺
  const haveR={};state.regsLocal.forEach(r=>haveR[r.title]=true);
  d.regsLocal.forEach(r=>{if(!haveR[r.title])state.regsLocal.push(r);});
  saveState();toast("已补齐缺失的预置内容，你的数据未被清除");
  location.reload();
}

/* ===== 二级模块排序（一级菜单固定；HTML5 DnD + ▲▼ 备选） ===== */
let dragSrc=null, dragContainer=null;
function bindNavSort(){
  if(bindNavSort._bound)return;bindNavSort._bound=true;
  const nav=$("#nav");
  /* 保存某一组（.nav-items）内的二级顺序 */
  const saveGroup=container=>{
    const groupEl=container.closest(".nav-group");
    const gid=groupEl.dataset.group;
    state.settings.navOrderV2[gid]=[...container.querySelectorAll("button[data-view]")]
      .map(b=>b.dataset.view);
    saveState();
  };
  const setEdit=on=>{
    nav.classList.toggle("nav-editing",on);
    renderNavGroups();   // 重绘：编辑态按钮可拖并带 ▲▼
    $("#btnNavEdit").classList.toggle("hide",on);
    $("#btnNavDone").classList.toggle("hide",!on);
    $("#btnNavReset").classList.toggle("hide",!on);
  };
  /* ▲▼ 在同一组内移动 */
  const move=(b,dir)=>{
    const container=b.closest(".nav-items");
    const btns=[...container.querySelectorAll("button[data-view]")];
    const i=btns.indexOf(b);
    const j=dir==="up"?i-1:i+1;
    if(j<0||j>=btns.length){toast(dir==="up"?"已在本组最顶部":"已在本组最底部");return;}
    if(dir==="up")container.insertBefore(b,btns[j]);
    else container.insertBefore(b,btns[j].nextSibling);
    saveGroup(container);
    markActiveNav(currentViewId());
    toast("顺序已调整并保存");
  };
  $("#btnNavEdit").addEventListener("click",()=>{
    setEdit(true);
    if(("ontouchstart" in window)||navigator.maxTouchPoints>0)
      toast("触屏可直接点 ▲ ▼ 调整二级模块；一级菜单固定");
  });
  $("#btnNavDone").addEventListener("click",()=>{setEdit(false);toast("模块顺序已保存");});
  $("#btnNavReset").addEventListener("click",()=>{
    state.settings.navOrderV2={};saveState();
    setEdit(false);renderNavGroups();toast("已恢复各组默认排序");
  });
  /* ---------- 原生拖拽（仅限同组 .nav-items 内部） ---------- */
  nav.addEventListener("dragstart",e=>{
    const b=e.target.closest("button[data-view]");if(!b)return;
    dragSrc=b;dragContainer=b.closest(".nav-items");
    b.classList.add("dragging");
    e.dataTransfer.effectAllowed="move";
    try{e.dataTransfer.setData("text/plain",b.dataset.view);}catch(_){}
  });
  nav.addEventListener("dragend",()=>{
    if(dragSrc)dragSrc.classList.remove("dragging");
    dragSrc=null;dragContainer=null;
    nav.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));
  });
  /* dragover：仅当悬停在源所在的同一组内才允许放置 */
  const over=e=>{
    const b=e.target.closest("button[data-view]");
    const container=e.target.closest(".nav-items");
    nav.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));
    if(!b||!dragSrc||container!==dragContainer)return; // 跨组/一级菜单：不允许
    e.preventDefault();
    e.dataTransfer.dropEffect="move";
    b.classList.add("drag-over");
  };
  nav.addEventListener("dragenter",over);
  nav.addEventListener("dragover",over);
  nav.addEventListener("drop",e=>{
    const target=e.target.closest("button[data-view]");
    const container=e.target.closest(".nav-items");
    if(!target||!dragSrc||container!==dragContainer||target===dragSrc)return;
    e.preventDefault();e.stopPropagation();
    /* 二级条目垂直排列：按鼠标 Y 的前后半决定插入位置 */
    const r=target.getBoundingClientRect();
    const after=(e.clientY-r.top)>r.height/2;
    if(after)target.after(dragSrc);else target.before(dragSrc);
    target.classList.remove("drag-over");
    saveGroup(container);
    markActiveNav(currentViewId());
    toast("已放置，顺序已保存");
  });
  /* ▲▼ 点击（捕获阶段，先于其他点击处理） */
  nav.addEventListener("click",e=>{
    const mv=e.target.closest(".mv");
    if(mv){e.preventDefault();e.stopPropagation();
      move(mv.closest("button[data-view]"),mv.dataset.mv);}
  },true);
}

/* 新模块的事件绑定（控件 change、文件导入、恢复预置） */
function bindExtra(){
  if(bindExtra._bound)return;bindExtra._bound=true;
  /* 恢复预置数据 */
  const br=$("#btnRestore");if(br)br.addEventListener("click",()=>{
    if(confirm("将补齐缺失的预置词块/题目/项目/法规，不会清除你的任何数据。继续？"))restorePreset();
  });
  /* 背单词控件（事件委托，重渲染后仍有效） */
  document.addEventListener("change",e=>{
    const t=e.target;
    if(t.id==="wBank"){state.wordStudy.bank=t.value;wSession=null;saveState();renderWords();}
    else if(t.id==="wGoal"){state.wordStudy.dailyGoal=Math.max(5,Number(t.value)||30);saveState();}
    else if(t.id==="wLetter"||t.id==="wLevel"){if(wSession)renderWordItem();}
    else if(t.id==="wordFile"){if(t.files[0])importWords(t.files[0]);t.value="";}
    /* 岗位状态下拉 */
    else if(t.dataset&&t.dataset.act==="jbStatus"){
      const i=Number(t.dataset.id);
      if(state.jobApps[i]){state.jobApps[i].status=t.value;saveState();toast("状态已更新");}
    }
  });
  /* 拼写框回车提交 */
  document.addEventListener("keydown",e=>{
    if(e.target.id==="wSpellInput"&&e.key==="Enter"){e.preventDefault();spellCheck();}
  });
}

/* =====================================================================
 * 初始化
 * ===================================================================== */
function init(){
  loadState();   // loadState 内部直接设置全局 state
  /* 注册视图渲染器（导航与预渲染共用） */
  Object.assign(RENDERERS,{
    dashboard:renderDashboard, daily:renderDaily, chunks:renderChunks,
    words:renderWords, sentence:renderSentence, projects:renderProjects,
    targets:renderTargets, jobs:renderJobs, myq:renderMyQ,
    extq:renderExtQ, reglib:renderRegLibrary, trans:renderTrans, answers:renderAnswers,
    listening:renderListening, plan:renderPlan, stats:renderStats, search:renderSearch
  });
  applyTheme();
  renderNavGroups(); // 渲染一级分组与二级模块（含用户排序/展开状态）
  /* 预渲染全部视图（保证项目文件输入等元素就位），默认显示仪表盘 */
  Object.entries(RENDERERS).forEach(([k,fn])=>{try{fn();}catch(err){console.warn(k,err);}});
  bindProjectFile();
  bindExtra();
  bindNavSort();     // 启用二级模块排序
  /* 初始路由：优先 hash（含旧路由别名），默认仪表盘 */
  const initial=viewFromHash();
  switchView(initial||"dashboard");
  if(initial)toast("已按旧链接跳转到对应模块");
  /* 已配置 Supabase 则后台静默拉取 */
  if(state.settings.supabaseUrl)refreshAll().then(()=>{if($("#view-daily").classList.contains("active"))renderDaily();});
}
document.addEventListener("DOMContentLoaded",init);
