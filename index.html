<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核药CRA英文训练舱</title>
<style>
/* ============ 设计变量 / 深色模式 ============ */
:root{
  --bg:#f4f6fb; --bg2:#ffffff; --bg3:#eef1f8; --text:#1c2333; --text2:#5a6478;
  --line:#e2e7f2; --brand:#2563eb; --brand2:#1d4ed8; --brand-soft:#e0ebff;
  --green:#16a34a; --green-soft:#dcfce7; --amber:#d97706; --amber-soft:#fef3c7;
  --red:#dc2626; --red-soft:#fee2e2; --purple:#7c3aed; --purple-soft:#ede9fe;
  --shadow:0 2px 10px rgba(20,40,90,.07); --radius:14px;
}
html.dark{
  --bg:#0f1420; --bg2:#171e2e; --bg3:#1e2740; --text:#e7ecf6; --text2:#9aa6bf;
  --line:#2a3550; --brand:#5b8cff; --brand2:#82a6ff; --brand-soft:#1e2c4d;
  --green:#4ade80; --green-soft:#16331f; --amber:#fbbf24; --amber-soft:#3a2c0c;
  --red:#f87171; --red-soft:#3b1d1d; --purple:#a78bfa; --purple-soft:#2c2150;
  --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:15px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-size:14px;padding:8px 14px;background:var(--bg3);color:var(--text);transition:.15s}
button:hover{filter:brightness(.96)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--brand);color:#fff}
button.primary:hover{background:var(--brand2)}
button.ghost{background:transparent;border:1px solid var(--line)}
button.sm{padding:4px 10px;font-size:12.5px}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);color:var(--text);width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
/* ============ 顶栏 / 导航 ============ */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;white-space:nowrap}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--text2)}
.spacer{flex:1}
.top-actions{display:flex;gap:7px;flex-wrap:wrap}
.navwrap{background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:40}
.nav{max-width:1280px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
.nav button{background:transparent;border-radius:8px 8px 0 0;padding:10px 13px;white-space:nowrap;color:var(--text2);border-bottom:2px solid transparent}
.nav button.active{color:var(--brand);border-bottom-color:var(--brand);background:var(--brand-soft)}
#menuBtn{display:none}
/* ============ 布局 ============ */
main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.view{display:none;animation:fade .2s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title{font-size:19px;font-weight:800;margin:6px 0 4px}
.muted{color:var(--text2);font-size:13px}
h2.page{font-size:21px;font-weight:800;margin-bottom:4px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.space-between{justify-content:space-between}
/* 统计数字卡 */
.stat{text-align:center;padding:14px 8px}
.stat .num{font-size:26px;font-weight:800;color:var(--brand)}
.stat .lbl{font-size:12.5px;color:var(--text2)}
/* 进度环 */
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--bg3) 0);display:grid;place-items:center;margin:0 auto}
.ring::before{content:attr(data-p)"%";width:92px;height:92px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-weight:800;font-size:20px}
/* 条形图 */
.bar{height:11px;border-radius:6px;background:var(--bg3);overflow:hidden;margin:5px 0 10px}
.bar i,.bar .fill{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#60a5fa);border-radius:6px;transition:width .5s}
/* 标签 chips */
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;background:var(--bg3);color:var(--text2);margin:1px 3px 1px 0}
.chip.cat{background:var(--brand-soft);color:var(--brand)}
.chip.lv1{background:var(--green-soft);color:var(--green)}
.chip.lv2{background:var(--amber-soft);color:var(--amber)}
.chip.lv3{background:var(--purple-soft);color:var(--purple)}
.chip.s0{background:var(--bg3);color:var(--text2)}
.chip.s1{background:var(--amber-soft);color:var(--amber)}
.chip.s2{background:var(--green-soft);color:var(--green)}
.chip.s3{background:var(--purple-soft);color:var(--purple)}
/* 任务列表 */
.task{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.task.done{opacity:.6}
.task.done .tname{text-decoration:line-through}
.task .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex-shrink:0;color:#fff}
.task.done .tick{background:var(--green);border-color:var(--green)}
.task .tname{flex:1}
.task .tmin{font-size:12px;color:var(--text2)}
/* 词块/题目卡片 */
.item-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.en{font-weight:700;font-size:16.5px}
.ipa{color:var(--brand);font-size:14px;cursor:pointer}
.ipa:hover{text-decoration:underline}
.icon-btn{padding:5px 9px;font-size:13px}
.detail{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:13.5px}
.detail p{margin:4px 0}
label.inline{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--text2);margin:5px 0}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filterbar input,.filterbar select{width:auto;min-width:120px}
.filterbar .grow{flex:1;min-width:180px}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg3);font-weight:700;position:sticky;top:0}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius)}
/* 每日更新五列 */
.columns5{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.dcol{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:13px;max-height:520px;overflow:auto}
.dcol h4{font-size:14px;margin-bottom:9px;padding-bottom:7px;border-bottom:2px solid var(--brand-soft)}
.dcol .mini{font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.dcol .mini a{font-weight:600}
/* 弹窗 */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:100;display:none;place-items:center;padding:16px}
.modal-bg.open{display:grid}
.modal{background:var(--bg2);border-radius:16px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:3px}
/* 计时器 */
.timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:1px}
.rating-group button.on{background:var(--brand);color:#fff}
.star-tip{background:var(--amber-soft);border-radius:10px;padding:10px 13px;font-size:13px;margin:8px 0}
.answer-box{background:var(--bg3);border-radius:10px;padding:12px;font-size:13.5px;white-space:pre-wrap;margin:8px 0}
.bullets{margin:6px 0 6px 18px;font-size:13px}
.bullets li{margin:3px 0}
.rec-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:5px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.pill-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pill-tabs button.on{background:var(--brand);color:#fff}
.hide{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg2);padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:.95}
kbd{background:var(--bg3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11.5px}
@media(max-width:760px){
  .navwrap{top:0;position:relative}
  .logo small{display:none}
  .topbar-in{padding:8px 12px}
  main{padding:14px 12px 50px}
  .section-title{font-size:17px}
}
/* ===== 靶点库 / 岗位 / 背单词 新增样式 ===== */
.btn{display:inline-block;border-radius:9px;padding:8px 14px;font-size:14px;
  background:var(--bg3);color:var(--text);border:1px solid transparent;cursor:pointer;}
.btn.ghost{background:transparent;border-color:var(--line);}
.btn:hover{filter:brightness(.97);}
.small{font-size:12.5px;}
.mts{margin-top:12px;}
.gap{gap:9px;}
.wrap{flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(max-width:620px){.grid2{grid-template-columns:1fr;}}
.empty{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;
  padding:28px;text-align:center;color:var(--text2);}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:1000px){.grid3,.grid4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){.grid3,.grid4{grid-template-columns:1fr;}}
.tg-card{display:flex;flex-direction:column;gap:8px;}
.tg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.tg-name{font-weight:700;font-size:1.05rem;}
.tg-iso{display:flex;flex-wrap:wrap;gap:4px;}
.grp-title{margin:18px 0 8px;border-left:4px solid var(--brand);padding-left:8px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;}
@media(max-width:620px){.form-grid{grid-template-columns:1fr;}}
/* 背单词卡片 */
.wcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  padding:26px;text-align:center;box-shadow:var(--shadow);min-height:180px;
  display:flex;flex-direction:column;justify-content:center;gap:10px;}
.wword{font-size:1.7rem;font-weight:800;letter-spacing:.3px;}
.winput{font-size:1.2rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--bg2);color:var(--text);text-align:center;width:100%;}
.wfront,.wback{display:flex;flex-direction:column;gap:8px;align-items:center;}
.btn.opt{font-size:1.05rem;padding:12px;}
.opt-right{border-color:#16a34a!important;background:rgba(22,163,74,.15)!important;color:#16a34a!important;}
.opt-wrong{border-color:#dc2626!important;background:rgba(220,38,38,.12)!important;color:#dc2626!important;}
.btn.speaking{background:#dc2626;color:#fff;border-color:#dc2626;}
.btn.danger{border-color:#dc2626;color:#dc2626;}
.btn.ok{border-color:#16a34a;color:#16a34a;}
.center{text-align:center;align-items:center;}
.row.center{justify-content:center;}
.wcard .muted{font-size:.95rem;}
.tablewrap{overflow-x:auto;}
select[data-act=jbStatus]{padding:4px 6px;}
/* 导航排序工具 */
.nav-tools{display:flex;gap:6px;padding:6px 10px;background:var(--bg);}
/* 一级分组（固定，不可拖拽） */
.nav-group{margin-bottom:2px;}
.nav-group-head{display:flex;justify-content:space-between;align-items:center;
  width:100%;background:var(--bg2);font-weight:700;font-size:13px;
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;}
.nav-group-head .arrow{transition:transform .2s;font-size:10px;color:var(--text2);}
.nav-group.collapsed .arrow{transform:rotate(-90deg);}
.nav-items{display:flex;flex-direction:column;gap:3px;padding:5px 4px;}
.nav-group.collapsed .nav-items{display:none;}
.nav-items button{position:relative;text-align:left;width:100%;}
.nav-items button.active{background:var(--brand);color:#fff;border-color:var(--brand);}
/* 排序编辑态：仅二级模块可拖，一级固定 */
.nav.nav-editing .nav-group-head{cursor:default;opacity:.7;}
.nav.nav-editing .nav-items{outline:1.5px dashed var(--brand);border-radius:8px;}
.nav-items button.drag-over{outline:2px dashed var(--brand2);outline-offset:1px;}
.nav-items button.dragging{opacity:.45;}
.nav-items .mv{display:inline-flex;align-items:center;justify-content:center;
  position:absolute;top:50%;transform:translateY(-50%);
  width:18px;height:16px;border-radius:4px;
  background:var(--brand-soft);color:var(--brand);font-size:8px;cursor:pointer;}
.nav-items .mv.up{right:24px;}
.nav-items .mv.dn{right:4px;}
.nav.nav-editing .nav-items button{padding-right:46px;cursor:grab;}
.nav.nav-editing .nav-items button:active{cursor:grabbing;}
/* 红色安全警告 */
.security-warn{background:var(--red-soft);border:1.5px solid var(--red);color:var(--red);
  border-radius:10px;padding:10px 12px;font-weight:600;margin:8px 0;}
.security-tip{background:var(--brand-soft);border:1px solid var(--brand);border-radius:10px;
  padding:9px 12px;font-size:13px;margin:8px 0;}
.pw-wrap{position:relative;display:flex;gap:6px;align-items:center;}
.pw-wrap input{flex:1;}
.pw-wrap .toggle-eye{width:auto;padding:6px 10px;}
/* 法规库 */
.reg-card h3{font-size:1.02rem;}
.reg-meta{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;}
.reg-clause{background:var(--bg3);border-radius:10px;padding:10px;margin:8px 0;font-size:13.5px;}
.reg-clause p{margin:4px 0;}
.reg-interp{border-left:3px solid var(--green);padding-left:9px;margin:8px 0;font-size:13.5px;}
.filterbar2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.filterbar2 select,.filterbar2 input{width:auto;flex:1;min-width:140px;}
/* 翻译练习术语高亮 */
.term-hit{background:var(--green-soft);color:var(--green);border-radius:4px;padding:0 3px;}
.term-miss{background:rgba(217,160,25,.18);color:var(--amber);border-radius:4px;padding:0 3px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="logo">核药CRA英文训练舱<small>Nuclear CRA English Training Cabin</small></div>
    <div class="spacer"></div>
    <div class="top-actions">
      <button class="sm ghost" id="btnSearch" title="全局搜索">🔍 全局搜索</button>
      <button class="sm ghost" id="btnExport">导出 JSON</button>
      <button class="sm ghost" id="btnImport">导入 JSON</button>
      <button class="sm ghost" id="btnReset">重置数据</button>
      <button class="sm ghost" id="btnRestore" title="只补充缺失的预置项，不清空用户数据">恢复预置</button>
      <button class="sm" id="btnTheme" title="深色模式">🌙</button>
    </div>
  </div>
</header>
<div class="navwrap">
  <div class="nav-tools">
    <button class="sm ghost" id="btnNavEdit" title="调整二级模块顺序">编辑排序</button>
    <button class="sm ghost hide" id="btnNavReset">恢复默认排序</button>
    <button class="sm hide" id="btnNavDone">完成</button>
  </div>
  <nav class="nav" id="nav"><!-- 分组菜单由 JS 渲染 --></nav>
</div>
<main>
  <section class="view active" id="view-dashboard"></section>
  <section class="view" id="view-daily"></section>
  <section class="view" id="view-chunks"></section>
  <section class="view" id="view-words"></section>
  <section class="view" id="view-sentence"></section>
  <section class="view" id="view-projects"></section>
  <section class="view" id="view-targets"></section>
  <section class="view" id="view-jobs"></section>
  <section class="view" id="view-myq"></section>
  <section class="view" id="view-extq"></section>
  <section class="view" id="view-reglib"></section>
  <section class="view" id="view-trans"></section>
  <section class="view" id="view-answers"></section>
  <section class="view" id="view-listening"></section>
  <section class="view" id="view-plan"></section>
  <section class="view" id="view-stats"></section>
  <section class="view" id="view-search"></section>
</main>

<!-- 通用弹窗 -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<input type="file" id="hiddenFile" class="hide" accept=".json">
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
 * 核药CRA英文训练舱 v2 —— 单文件版
 * 模块：仪表盘 / 每日更新中心 / 词块 / 造句 / 项目库 / 我的题库 /
 *       外企题库 / 答案库 / 听力 / 周计划 / 统计 / 搜索
 * 存储：localStorage(nuclearCraStudyApp) + Supabase REST（可选，失败降级）
 * ===================================================================== */

/* ---------- 工具函数 ---------- */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}
function addDays(dateStr,n){const d=new Date(dateStr);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ---------- 语音朗读 speechSynthesis（优先 en-US，其次 en-GB） ---------- */
let TTS_VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  TTS_VOICE=vs.find(v=>v.lang==="en-US")||vs.find(v=>v.lang.startsWith("en-US"))||
            vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang.startsWith("en"))||null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
const TTS_SUPPORTED=("speechSynthesis" in window);
let TTS_BTN=null, TTS_BTN_LABEL="";
/* 停止当前朗读并还原按钮 */
function stopSpeak(){
  if(TTS_SUPPORTED)speechSynthesis.cancel();
  restoreTtsBtn();
}
function restoreTtsBtn(){
  if(TTS_BTN){TTS_BTN.textContent=TTS_BTN_LABEL;TTS_BTN.classList.remove("speaking");TTS_BTN=null;TTS_BTN_LABEL="";}
}
/* 基础朗读：先 cancel 再 speak；onEnd 回调 */
function speak(text,rate=1,onEnd){
  if(!TTS_SUPPORTED){toast("当前浏览器不支持朗读");if(onEnd)onEnd();return;}
  speechSynthesis.cancel();
  restoreTtsBtn();
  const u=new SpeechSynthesisUtterance(text);
  if(TTS_VOICE)u.voice=TTS_VOICE; u.lang=TTS_VOICE?TTS_VOICE.lang:"en-US"; u.rate=rate;
  u.onend=()=>{restoreTtsBtn();if(onEnd)onEnd();};
  u.onerror=()=>{restoreTtsBtn();if(onEnd)onEnd();};
  speechSynthesis.speak(u);
}
/* 按语言朗读（中/英），自动挑选匹配语音；无匹配则交给默认语音 */
function speakLang(text,lang="en-US",rate=1){
  if(!TTS_SUPPORTED){toast("当前浏览器不支持朗读");return;}
  speechSynthesis.cancel();restoreTtsBtn();
  const voices=speechSynthesis.getVoices();
  let v=voices.find(x=>x.lang===lang)||voices.find(x=>x.lang.startsWith(lang.slice(0,2)));
  const u=new SpeechSynthesisUtterance(text);
  if(v)u.voice=v; u.lang=v?v.lang:lang; u.rate=rate;
  u.onend=restoreTtsBtn;u.onerror=restoreTtsBtn;
  speechSynthesis.speak(u);
}
/* 按钮式朗读：朗读中按钮变“■ 停止”，再点停止 */
function toggleSpeak(btn,text,rate=1){
  if(!TTS_SUPPORTED){toast("当前浏览器不支持朗读");return;}
  if(TTS_BTN===btn){stopSpeak();return;}
  TTS_BTN=btn;TTS_BTN_LABEL=btn.textContent;
  btn.classList.add("speaking");btn.textContent="■ 停止";
  speak(text,rate);
}

/* ---------- 录音 MediaRecorder（浏览器不支持时自动隐藏按钮） ---------- */
const Recorder={
  rec:null, chunks:[], url:null, stream:null,
  supported: !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder),
  async start(){
    this.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    this.chunks=[];
    this.rec=new MediaRecorder(this.stream);
    this.rec.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data);};
    this.rec.start();
  },
  stop(){
    return new Promise(res=>{
      this.rec.onstop=()=>{
        (this.stream||{getTracks:()=>[]}).getTracks().forEach(t=>t.stop());
        this.url=URL.createObjectURL(new Blob(this.chunks,{type:"audio/webm"}));
        res(this.url);
      };
      this.rec.stop();
    });
  }
};

["How do you prepare for a monitoring visit?","你如何准备一次监查访视？","mon","通用/Glassdoor",2,
"I prepare in three steps. First, I review the study background in the CTMS: the monitoring plan, previous visit report, outstanding findings and action items, so nothing is missed. Second, I look at current data, including enrollment, open queries, deviations, AE and SAE listings, and I identify the critical data and high-risk areas for targeted SDV. Third, I coordinate logistics with the site: I send a visit letter with the proposed agenda, confirm availability of the investigator, coordinator and source documents, and plan time for an opening and closing discussion. I also prepare checklists and templates in advance. This preparation makes the visit focused and efficient and helps me verify that previous issues have been resolved.",
["CTMS 回顾：上次报告与遗留项","数据回顾：入组/质疑/偏离/安全","现场协调：访视函、议程、人员","准备清单与模板"],
"不看上次报告、无议程、到现场才发现文件不在",
["How far in advance do you plan visits?","What if the site is not ready?"]],
["How do you conduct SDV?","你如何做原始数据核对（SDV）？","mon","PPD",2,
"I follow a risk-based approach. I start with the highest-priority data: informed consent, eligibility, primary endpoints, safety data such as AEs and SAEs, and IP accountability. For each selected item I compare the eCRF entry directly against the source document, such as the medical record, lab printout or imaging report, checking values, dates and units. When I find a discrepancy, I determine whether it is a site error requiring a correction, a data query, or a potential deviation, and I document it clearly. I also confirm that source data are attributable, legible, contemporaneous, original and accurate. After the visit I follow up each item to closure and verify corrections at the next visit.",
["确定优先级：同意/入选/终点/安全/药品","逐条对照源文件","差异分类：更正/质疑/偏离","ALCOA 与闭环跟进"],
"100% 全量核对浪费时间、只改 eCRF 不查根因",
["What percentage of SDV is appropriate?","How do you document an SDV finding?"]],
["Walk me through an SIV.","讲一下你如何做中心启动访视（SIV）。","mon","IQVIA",2,
"At the SIV I confirm all approvals and essential documents are in place, then train the site team on the protocol, procedures, systems and safety reporting. I review the delegation log and responsibilities, confirm drug and supply readiness, and walk through enrollment and source document expectations. I close by confirming the site is ready to screen and documenting any remaining actions.",
["文件与批准到位","方案/系统/安全培训","授权与供应就绪","确认可筛选"],
"只开会不核对文件",
["What must be complete before an SIV?"]],
["What do you focus on during an IMV?","中期监查访视你关注什么？","mon","ICON",2,
"During an IMV I focus on consent and ongoing eligibility, SDV of critical data, IP accountability and storage, AE and SAE reconciliation, deviations, query progress and updates to essential documents. I also assess enrollment against plan and verify previous action items.",
["同意与资格","SDV 与药品","安全/偏离/质疑","入组与遗留项"],
"只关注数据录入、忽略安全和文件",
["How do you decide the IMV frequency?"]],
["How do you prepare for a close-out visit?","你如何准备中心关闭访视？","mon","Parexel",2,
"Before COV I confirm all queries are resolved, all subjects completed the study, final safety reconciliation is done, and IP accountability and return or destruction are documented. I also prepare the final document list for archiving and confirm any ongoing obligations such as safety follow-up.",

"简单理解为少做监查",
["Give an example of a risk indicator."]],
["How do you prioritize what to verify?","你如何决定核对的优先级？","mon","ICON",2,
"I rank items by impact on safety and key endpoints, then by known site performance and previous findings. Consent, eligibility, primary endpoints, SAEs and IP accountability come first; lower-risk data receive lighter review.",

["How do you review IP storage?","你如何检查试验药品储存？","mon","Parexel",2,

["How do you manage site issues?","你如何管理中心问题？","mon","IQVIA",2,

"把两者混为一谈",
["When would SDR add more value than SDV?"]],

"通过个人邮箱收发敏感数据",
["What cannot be monitored remotely?"]],

/* ===== 核药 nuc (25) ===== */
["How do you manage IP accountability for radiopharmaceuticals?","你如何管理放射性药物的药品计数？","nuc","通用/Glassdoor",3,
"Radiopharmaceuticals need special accountability because they decay and are often prepared per patient. I review the preparation and administration records in the hot lab, including the lot or batch, activity measured in the dose calibrator, calibration date and time, and the administered activity and residual activity. I compare prepared, administered, decayed and wasted amounts, using decay correction where required, to confirm every dose is traceable. I also check that doses were labeled correctly, administered to the right subject, and given within the allowed time. Any unexplained discrepancy is documented and investigated, and I confirm radioactive waste was handled per procedure. Because doses cannot be returned like conventional drugs, documentation must be contemporaneous and precise.",
["逐患者配制、随衰变变化","核对配制/给药记录与活度","衰变校正下的收发存核对","标签、受试者与时间核对","废物处置与差异调查"],
"用普通药品的盒数计数、忽略活度和时间、事后补记录",
["How do you account for residual activity?","What discrepancy did you once find?"]],
["How do you coordinate PET/CT imaging and dosimetry?","你如何协调 PET/CT 显像和剂量学？","nuc","Telix",3,
"I coordinate three things: scheduling, acquisition standards and data collection. I work with the nuclear medicine team to book scans at the protocol time points and within the imaging window, and I confirm the scanner and reconstruction settings are consistent so SUV and uptake data are comparable. For dosimetry, I verify the required serial scans and blood or whole-body samples are collected on schedule, and that time-activity curves and organ dose estimates are completed and reviewed. I track missed or delayed scans as deviations and follow up queries promptly. Early communication and a clear site schedule prevent most timing issues.",
["排程：时间点与显像窗","采集标准：设备与重建一致","剂量数据：连续扫描与曲线","偏离与质疑跟进"],
"只核对有没有扫描、不核对采集参数和时间点",
["What happens when a scan falls outside the window?","How are organ doses reviewed?"]],
["How do you ensure radiation safety?","你如何确保辐射安全？","nuc","Lantheus",3,
"I ensure safety through documentation and behavior. I verify staff training and personal dosimeter use, controlled access to the hot lab and injection areas, proper shielding and contamination monitoring, and availability of survey meters and spill kits. I confirm pregnancy testing and breastfeeding restrictions where required and that radioactive waste is stored and recorded correctly. During visits I observe workflows against ALARA principles, using time, distance and shielding, and I check that radiation safety procedures and emergency contacts are current. Any incident or contamination event is documented and investigated.",
["培训与个人剂量计","管控区域、屏蔽与监测","妊娠/哺乳与废物管理","ALARA 与事件调查"],
"只查文件、不观察实际操作",
["Tell me about a radiation safety issue you encountered."]],
["What is a radiopharmaceutical?","什么是放射性药物？","nuc","Curium",1,
"A radiopharmaceutical is a medicinal product containing a radionuclide, used for diagnosis or therapy. It combines a radioactive component with a biological carrier such as a peptide, antibody or small molecule that directs it to a target.",
["含放射性核素的药品","诊断或治疗用途","载体决定靶向性"],
"把它等同于普通造影剂",
["Give an example of a diagnostic and a therapeutic one."]],
["Explain the theranostic concept.","解释诊疗一体化概念。","nuc","Novartis",2,
"Theranostics pairs a diagnostic tracer and a therapeutic radionuclide against the same target, such as PSMA. The diagnostic scan identifies patients likely to benefit, and the therapeutic product then treats them, enabling personalized treatment.",
["同一靶点的诊断+治疗","诊断筛选获益人群","治疗实现个体化"],
"说成简单的联合用药",
["What theranostic pairs do you know?"]],
["What is PSMA and why is it targeted?","什么是 PSMA，为什么以它为靶点？","nuc","Telix",2,
"PSMA is a membrane protein highly expressed on prostate cancer cells, with limited expression in many normal tissues. Targeting it allows sensitive PET imaging and delivery of therapeutic radiation to tumors and metastases.",
["前列腺癌高表达","正常组织表达有限","可显像也可治疗"],
"说不出生物学意义",
["How is PSMA expression confirmed?"]],
["How does a radionuclide half-life affect the study?","核素半衰期如何影响研究？","nuc","通用",2,
"The half-life determines production, scheduling and the usable time after preparation. Short-lived isotopes such as Ga-68 require tight coordination of preparation and imaging, and activity must be interpreted with decay correction.",
["决定生产与排程","短寿命核素要求紧凑协调","活度需衰变校正"],
"忽视时间、按固定剂量理解",
["How do you plan around a 68-minute half-life?"]],
["How is a dose calibrated before injection?","注射前剂量如何校准？","nuc","Curium",2,
"The prepared dose is measured in a calibrated dose calibrator, which displays activity at the measurement time. The reading, time and operator are recorded, and the dose is labeled and administered within the allowed period, with decay correction as needed.",
["活度计测量","记录读数、时间、操作者","按时给药与衰变校正"],
"只记录体积不记录活度",
["How often is the calibrator checked?"]],
["What happens in the hot lab?","热室里进行哪些工作？","nuc","通用",1,
"The hot lab is the shielded area where doses are eluted or prepared, labeled, measured in the dose calibrator and checked for quality before transport to the injection room.",
["配制与标记","活度测量与质控","转运至注射室"],
"把热室当普通药房",
["What records are generated there?"]],
["What is decay correction?","什么是衰变校正？","nuc","通用",3,
"Decay correction adjusts a measured activity to a reference time using the radionuclide half-life, allowing accurate comparison of prepared, administered and residual activities.",
["按半衰期校正到参考时间","保证活度可比"],
"公式和用途说不清",
["When is it required in accountability?"]],
["How do you verify the administered activity?","你如何核实给药活度？","nuc","Lantheus",2,
"I compare the dose calibrator record, the administration record and time, and the eCRF, confirming they match for the correct subject and that any residual activity is documented.",
["校准记录与给药记录核对","受试者与时间一致","残留活度记录"],
"只看 eCRF 数字",
["What if actual activity differs from planned?"]],
["What is radiochemical purity?","什么是放射化学纯度？","nuc","通用",3,
"It is the fraction of total radioactivity present as the desired radiochemical species. It is a key release quality check because free isotope or impurities can alter biodistribution and safety.",
["目标成分的放射性占比","关键放行质控","杂质影响分布与安全"],
"与放射性核素纯度混淆",
["How is it measured?"]],
["How do you monitor dosimetry data?","你如何监查剂量学数据？","nuc","Telix",3,
"I verify the required serial imaging time points were completed, source data for time-activity curves are available, and organ and whole-body dose estimates were calculated and reviewed per protocol, following up missing data as queries or deviations.",
["连续时间点完整","曲线源数据可得","剂量估算经审阅"],
"只看最终剂量结论",
["Which organs receive special attention?"]],
["What is a time-activity curve used for?","时间-活度曲线有什么用？","nuc","通用",3,
"It plots activity in an organ or lesion over time, showing uptake and clearance and providing the input for internal dosimetry calculations.",
["反映摄取与清除","剂量学计算输入"],
"只解释成普通图表",
["How is it linked to organ dose?"]],
["How do you manage a radionuclide generator?","你如何管理核素发生器？","nuc","Curium",3,
"I check elution records, generator expiry and calibration, consistency of eluted activity and QC, and that only trained personnel operate it. Records support traceability of each patient dose.",
["淋洗记录与效期","活度与质控一致性","人员培训与追溯"],
"发生器无使用记录",
["What QC follows an elution?"]],
["What is SUV and why does it matter?","什么是 SUV，为什么重要？","nuc","通用",2,
"SUV, or standardized uptake value, normalizes radiotracer uptake to injected activity and body factors. It supports quantitative comparison, but it is only reliable when acquisition and calibration are consistent.",
["归一化摄取","支持定量比较","依赖一致的采集与校准"],
"把 SUV 当成绝对真理",
["What affects SUV accuracy?"]],
["How do you ensure scan consistency across sites?","如何保证各中心扫描一致性？","nuc","多公司",3,
"I verify sites follow the imaging manual for scanner settings, reconstruction, timing and patient preparation, and that qualification scans and quality checks are documented before study scans.",
["统一设备/重建/时间/准备","资质扫描与质控记录"],
"只在方案里写、不做现场核实",
["How do you handle a non-compliant scanner?"]],
["What deviations are common in radiopharmaceutical trials?","核药试验常见哪些偏离？","nuc","通用",2,
"Common examples include scans outside the imaging window, delayed dose administration, missed dosimetry time points and deviations in preparation or documentation. Each is assessed for impact and corrected.",
["显像窗/给药时间","剂量学时间点","配制与记录问题"],
"认为核药没有特殊偏离",
["Which of these did you encounter?"]],
["How do you handle a missed imaging window?","错过显像时间窗你怎么处理？","nuc","Telix",3,
"I document the timing, assess whether the scan remains evaluable per the protocol or statistical plan, log a deviation if required, and agree preventive scheduling actions with nuclear medicine.",
["记录时间","评估数据是否可评价","按要求记偏离并预防"],
"直接让扫描作废或直接接受",
["Who decides evaluability?"]],
["What is attenuation correction?","什么是衰减校正？","nuc","通用",3,
"It corrects PET data for photons absorbed or scattered by the body, usually using the CT component, improving quantitative accuracy.",
["补偿光子吸收散射","通常基于 CT","改善定量准确性"],
"与衰变校正混淆",
["Why does it affect SUV?"]],
["How do you coordinate with the radiochemist or physicist?","你如何与放射化学师/物理师协调？","nuc","Curium",2,
"I align on preparation and QC timing, dosimetry collection and issue resolution, and I keep written records of agreements and follow-ups.",
["配制与质控时间","剂量采集与问题解决","书面记录"],
"只通过协调员传话",
["What issues did they escalate to you?"]],
["What special training do nuclear study teams need?","核药研究团队需要哪些特殊培训？","nuc","通用",2,
"Besides GCP and protocol training, teams need radiation safety, hot lab procedures, dose calibrator use, waste handling and, where relevant, dosimetry and imaging manual training, all documented.",
["GCP 之外的辐射安全培训","热室/活度计/废物处理","影像手册与剂量学"],
"认为 GCP 培训足够",
["How often is it refreshed?"]],
["How do you handle radioactive waste?","你如何处理放射性废物？","nuc","Lantheus",2,
"I confirm waste is categorized, labeled, shielded and stored in designated areas, with decay and disposal records meeting local radiation protection requirements.",
["分类、标记、屏蔽","专区储存","衰变与处置记录"],
"按普通医疗废物处理",
["What records demonstrate compliance?"]],
["What is the difference between PET and SPECT?","PET 和 SPECT 有什么区别？","nuc","通用",2,
"PET detects positron-emitting tracers and offers high sensitivity and quantification; SPECT detects gamma emissions, is widely available and often lower cost, with different isotopes and imaging characteristics.",
["探测正电子、高灵敏可定量","探测伽马射线、普及成本低","核素与特点不同"],
"认为两者可以完全互换",
["When would you choose SPECT?"]],
["How do you monitor a diagnostic performance study?","你如何监查诊断效能研究？","nuc","通用",2,
"I verify eligibility and reference standards, imaging performed per manual, blinded independent reads where required, and complete capture of sensitivity, specificity and agreement data, with SDV of case-level results.",
["入选与参考标准","显像规范与盲法阅片","效能数据完整与 SDV"],
"只关注图像、不关注阅片流程",
["How is reader bias prevented?"]],
/* ===== 行为面试 beh (35) ===== */
["Tell me about a time you handled a difficult site.","讲一次你处理难合作中心的经历。","beh","通用/Glassdoor",3,
"In one radiopharmaceutical IIT, the site was repeatedly late with data entry and missed the imaging window for two subjects, and communication had become defensive. First, I avoided escalating immediately and instead arranged a short meeting with the PI and coordinator to understand the cause. I found the coordinator was overloaded and unclear about the imaging schedule. We agreed on a simple weekly schedule, a shared tracker for scan appointments, and clear owners for queries. I also provided targeted retraining on the imaging window and IP documentation. Over the following weeks I gave quick, positive feedback when items were completed and rechecked progress at each visit. The site's query turnaround improved, no further imaging-window deviations occurred, and the relationship became cooperative. The experience taught me that most difficult sites respond to understanding root causes, practical tools and consistent communication rather than pressure.",
["情境：IIT 中心延误、两次错过显像窗","任务：扭转依从性与关系","行动：找根因、建排程跟踪、再培训、正反馈","结果：无再发、关系改善"],
"把责任全推给中心、直接威胁上报",
["What if the site had not improved?","How long did you wait before escalating?"]],
["Tell me about a time you met a tight deadline.","讲一次你赶上紧迫截止日期的经历。","beh","PPD",2,
"Before one SIV, the sponsor moved the date one week earlier because the site wanted to start screening, and several essential documents and training materials were still incomplete. I listed every remaining item with owners and deadlines, reprioritized my other work, and coordinated daily with the site and internal teams. I focused first on items that blocked activation, such as approvals, the delegation log and drug readiness, while preparing the training slides in the evenings. I also flagged risks early so the sponsor could make an informed decision. By the SIV date all critical items were complete, the visit proceeded, and the site activated on the new timeline. I now build buffers into start-up plans and track blockers visibly.",
["情境：SIV 提前一周","任务：启动关键项清零","行动：清单责任到人、每日协调、先攻阻断项","结果：按期启动、后续计划加缓冲"],
"只加班不列优先级、问题藏到最后",
["How do you decide what is truly critical?"]],
["Describe a time you disagreed with the PI.","描述一次你与 PI 意见不合的经历。","beh","IQVIA",3,
"In one study, the investigator believed a subject could continue despite a lab value that, in my reading of the protocol, met an exclusion or hold criterion. Rather than arguing, I re-read the protocol and the subject's data carefully and prepared the specific protocol references. I then discussed it respectfully with the PI, focusing on subject safety and shared goals rather than being right. The PI reviewed the evidence and agreed to follow the protocol, and we documented the decision. I also raised the question with the sponsor's medical monitor to confirm the interpretation. The situation stayed professional, and it reinforced that disagreements should be resolved through data, clear references and timely escalation.",
["情境：对受试者是否继续意见不同","任务：保证安全与方案依从","行动：查方案、给依据、尊重沟通、医学监察确认","结果：按方案处理并记录"],
"当场争执或顺从错误决定",
["What if the PI had insisted?"]],
["Tell me about a time you made a mistake.","讲一次你犯错的经历。","beh","通用",2,
"Early in one project I scheduled a monitoring visit without confirming the source documents would be available, so part of my planned SDV could not be completed on site. I noticed the gap during the visit, immediately adjusted the agenda to focus on what was available, and scheduled a short follow-up rather than leaving items open. Afterward I apologized to the coordinator for the inconvenience and changed my preparation checklist to include document availability confirmation before every visit. I shared the lesson with a new colleague. The follow-up was completed, and I never repeated the error. The mistake taught me to verify assumptions early and treat errors as opportunities to improve the process.",
["情境：访视未确认文件可用性","任务：减少对计划的影响","行动：调整议程、安排跟进、更新清单","结果：未再发生、流程改进"],
"声称自己没犯过错、或把错误推给别人",
["What did you learn about yourself?"]],
["What are your strengths and weaknesses?","你的优点和缺点是什么？","beh","通用",2,
"My main strengths are organization and attention to detail. For example, my structured visit preparation and trackers help me keep multiple sites and action items under control, and I often catch small discrepancies early. I also communicate consistently, which prevents issues from growing. My weakness is that early in my career I sometimes tried to solve too many details myself instead of delegating or asking for support, which could slow me down during busy periods. To improve, I now prioritize issues by impact, agree clear ownership with the site, and escalate or ask for help earlier. I also set time limits for refining documentation so thoroughness does not become inefficiency. These changes have made me more effective while keeping my quality standards high.",
["优点：组织与细节，配事例","弱点：过度亲力亲为","改进：分级、授权、早求助、设时限"],
"假弱点（太追求完美）、弱点与岗位核心冲突",
["How has that weakness affected your work?"]],
["How do you handle pressure?","你如何应对压力？","beh","ICON",2,
"I handle pressure by planning, reprioritizing and staying calm. When several demands collide, I list them by safety impact and deadline, focus on what I can control, and communicate realistic timelines early. Breaking work into small steps keeps it manageable.",
["规划与重排序","按影响和期限聚焦","及早沟通预期"],
"说自己从不感到压力",
["Give a recent example."]],
["Describe a time you worked effectively in a team.","描述一次高效团队合作。","beh","Parexel",2,
"During a Phase I PSMA study, the sponsor, site, nuclear medicine team and vendors had to align on tight dosimetry schedules. I took responsibility for a shared timeline and regular check-ins, clarified each role, and followed up blockers. The team completed the required assessments on time.",
["明确共同目标","共享时间线与检查点","跟进卡点"],
"只说大家合作愉快",
["What was your specific contribution?"]],
["Tell me about a time you showed leadership.","讲一次你展现领导力的经历。","beh","Syneos",3,
"When a new coordinator joined a busy site, I noticed they were unsure about query and IP processes. I took time to walk them through the requirements with examples, created a simple checklist, and stayed available for questions. Their performance improved quickly and errors dropped.",
["发现他人困难","主动带教与工具支持","结果改善"],
"把领导力理解成下命令",
["How did you balance teaching with your own work?"]],
["Describe a time you took initiative.","描述一次你主动担当的事。","beh","Fortrea",2,
"I noticed the same type of documentation gap appeared at two sites, so I created a short one-page reminder with examples and shared it during visits and calls. The recurring gap decreased, and the team adopted the reminder more broadly.",
["发现重复问题","制作简明工具并推广","问题减少"],
"只完成被安排的任务",
["How did sites react?"]],
["Tell me about a time you acted with integrity.","讲一次你坚守诚信的事。","beh","Medpace",3,
"During a visit I found a deviation that the site had not planned to report because it seemed minor, but it involved a consent timing issue. I explained why it mattered, supported the site in documenting it correctly, and escalated per process. Reporting it was the right step even though it created extra work.",
["发现未报告的问题","解释重要性并支持记录","按流程升级"],
"为了关系选择沉默",
["What guided your decision?"]],
["How do you respond to difficult feedback?","你如何回应尖锐的反馈？","beh","Worldwide",2,
"I listen fully without becoming defensive, ask clarifying questions, and turn the feedback into specific actions. After one report was returned for clearer wording, I studied the comments, revised my approach, and my later reports needed fewer changes.",
["不辩解、听完整","澄清并转化为行动","后续可见改进"],
"找借口或情绪化",
["What feedback was hardest to hear?"]],
["Describe a process you improved.","描述一个你改进的流程。","beh","Novotech",3,
"At one site follow-up items were tracked across separate emails, causing missed deadlines. I introduced a single tracker with owners, statuses and due dates, reviewed it weekly, and overdue items fell significantly.",
["识别痛点","统一跟踪工具","定期审阅、结果改善"],
"改进没有数据支撑",
["How did you get buy-in?"]],
["Tell me about learning something complex quickly.","讲一次你快速学会复杂内容的经历。","beh","PPD",2,
"When I first joined a radiopharmaceutical project, I had to learn nuclear medicine terminology and workflows fast. I built a personal term list, studied the imaging manual, and asked the medical physicist targeted questions. I could perform monitoring independently within a few weeks.",
["建立术语表","研读手册","向专家请教"],
"等别人来培训",
["How do you verify you truly understand?"]],
["How do you handle ambiguity?","你如何应对模糊不清的局面？","beh","IQVIA",3,
"When guidance is unclear, I gather the available facts, state my assumptions, and seek clarification from the right person while moving forward on what is clear. In one IIT with limited sponsor oversight, this approach kept documentation and decisions traceable.",
["收集事实、说明假设","寻求澄清","先推进明确部分"],
"停下来等待全部答案",
["What if clarification is delayed?"]],
["Describe how you prioritize conflicting priorities.","描述你如何处理相互冲突的优先事项。","beh","ICON",2,
"I compare impact on safety, data integrity and deadlines, then communicate trade-offs to stakeholders. When an SAE issue and a scheduled visit coincided, I addressed the safety matter first and adjusted the visit with timely notice.",
["按安全/完整性/期限排序","沟通权衡","及时调整安排"],
"试图同时做完所有事",
["How do you document the decision?"]],
["Tell me about going above and beyond.","讲一次你超出职责范围付出的经历。","beh","Parexel",3,
"A site risked missing a deadline because staff were unavailable during normal hours. I arranged an evening call to walk through the remaining items and supported them remotely, allowing the milestone to be met without compromising quality.",
["识别风险","非工作时间支持","里程碑达成"],
"把本职责内的事包装成额外付出",
["Would you do that regularly?"]],
["Tell me about a time you failed.","讲一次失败的经历。","beh","Syneos",3,
"I once underestimated the time needed for document collection at a new site, which delayed monitoring preparation. I acknowledged the issue, renegotiated an internal deadline, and added earlier checkpoints. Future start-ups were planned more realistically.",
["承认失败与影响","重新协商与补救","加入早期检查点"],
"失败与岗位无关或推卸责任",
["What would you do differently now?"]],
["How do you handle organizational change?","你如何应对组织变化？","beh","Fortrea",2,
"I focus on understanding the reason for the change, stay flexible, and reframe my plan around new priorities. When internal processes changed, I updated my trackers and helped site partners understand the new requirements.",
["理解变化原因","调整计划","帮助他人适应"],
"抵触或抱怨变化",
["Give an example of a change you managed."]],
["Describe a conflict you resolved at work.","描述一次你解决的工作冲突。","beh","Medpace",2,
"Two site team members disagreed about who should complete a specific eCRF module, delaying entry. I clarified the delegation expectations with the PI, facilitated an agreement, and documented responsibilities, after which the module stayed current.",
["定位冲突点","依据授权澄清","促成一致并记录"],
"回避冲突",
["How did you remain neutral?"]],
["How do you motivate others?","你如何激励他人？","beh","Worldwide",2,
"I find that clarity, recognition of progress and removing practical blockers motivate site teams. When a coordinator was overwhelmed, breaking tasks into smaller steps and acknowledging completion helped rebuild momentum.",
["明确目标","认可进展","扫除障碍、拆小任务"],
"只用施压方式",
["What demotivates a site team?"]],
["Describe a decision you made with limited information.","描述一次信息有限时做的决定。","beh","Novotech",3,
"When a site issue arose outside office hours, I assessed the immediate safety implications, followed the documented procedure, and contacted the appropriate person rather than waiting. I documented the basis for the action and reviewed it afterward.",
["先评估安全影响","按既有流程行动并联系负责人","记录与复盘"],
"在压力下凭感觉决定",
["What information would you want next time?"]],
["How do you handle a difficult stakeholder?","你如何应对难沟通的利益相关方？","beh","PPD",3,
"I prepare for their concerns, communicate clearly and professionally, and focus on shared objectives. With a very busy PI, I shifted to concise written summaries and decision-focused updates, which improved responsiveness.",
["预判顾虑","简洁专业、聚焦共同目标","调整沟通方式"],
"回避或情绪化",
["How do you maintain your position politely?"]],
["Tell me about ensuring quality under time pressure.","讲一次时间压力下保证质量的经历。","beh","IQVIA",2,
"During a high-enrollment period, I protected quality by keeping targeted SDV focused on critical data and not skipping required checks, while streamlining administrative steps. I also flagged the workload so timelines stayed realistic.",
["不跳过关键核查","聚焦关键数据","及时上报工作量"],
"为赶时间降低标准",
["What would you never compromise on?"]],
["How do you coach or mentor others?","你如何带教他人？","beh","ICON",3,
"I explain the why, demonstrate with examples, observe practice and give specific feedback. This approach helped new coordinators become independent with consent and query processes.",
["讲原理、做示范","观察练习","具体反馈"],
"替对方完成工作",
["How do you adapt coaching to different people?"]],
["Describe adapting your communication style.","描述一次调整沟通方式的经历。","beh","Parexel",2,
"With technical experts I used precise, detail-focused discussion, while with busy management I shifted to brief, decision-oriented summaries. Recognizing the audience made coordination more effective.",
["对专家讲细节","对管理层讲结论","按对象调整"],
"对所有人用同一方式",
["How do you identify someone's preferred style?"]],
["Tell me about a risk you identified early.","讲一次你及早发现的风险。","beh","Syneos",3,
"Reviewing data trends before a visit, I noticed enrollment documentation slipping at one site. I raised it early, reviewed processes with the team, and prevented what could have become consent or eligibility findings.",
["从趋势中识别信号","及早提出并审查流程","避免问题扩大"],
"等问题发生才反应",
["What indicators do you watch?"]],
["How do you deliver difficult news?","你如何传达困难的消息？","beh","Fortrea",3,
"I prepare the facts, communicate promptly and privately, explain the impact and options, and focus on next steps. When informing a site of a serious finding, this approach kept the discussion constructive.",
["事实清楚","及时、私下沟通","说明影响与下一步"],
"拖延或只报问题不给方向",
["How did the site respond?"]],
["Describe working without clear guidance.","描述一次在缺乏明确指导下工作的经历。","beh","Medpace",3,
"In an IIT with limited sponsor documentation, I used established GCP principles, documented my reasoning, and sought confirmation for uncertain points rather than improvising on safety matters.",
["依据 GCP 原则","记录判断依据","不确定处寻求确认"],
"在安全问题上自作主张",
["Where are the limits of independent judgment?"]],
["What accomplishment are you proudest of?","你最自豪的成就是什么？","beh","通用",2,
"I am proudest of supporting several investigator-initiated PET/CT trials while maintaining complete traceability and no missed safety reports, despite limited resources. It showed that disciplined monitoring works even in lean studies.",
["资源有限的 IIT","保持可追溯与安全报告零遗漏","体现监查纪律"],
"成就与岗位能力无关",
["What made that difficult?"]],
["How do you review laboratory data during a visit?","访视中你如何审阅实验室数据？","mon","Parexel",2,
"I compare the eCRF lab entries with the laboratory printouts, check units and reference ranges, flag clinically significant abnormalities and whether they were assessed as AEs, and confirm repeat tests required by the protocol were performed.",
["eCRF 与报告核对","单位参考范围","异常值的 AE 评估"],
"只核对数值、忽略临床意义",
["How do you handle a missing lab report?"]],
["Tell me about a time you persuaded someone.","讲一次你说服他人的经历。","beh","IQVIA",2,
"A site preferred its own data-entry sequence that caused late queries. I respectfully explained the downstream impact, showed a small example, and proposed a trial of the recommended order for two weeks. The results were clearer, and the site adopted it.",

let state=null;
const LS_KEY="nuclearCraStudyApp";

/* 读取并与预置数据按 id 合并（保证新版词块/题目能出现，同时保留用户进度） */
function loadState(){
  let raw=null;
  try{raw=JSON.parse(localStorage.getItem(LS_KEY));}catch(e){raw=null;}
  const d=defaultState();
  if(!raw){state=d;saveState();return;}
  // 先保存预置数组引用：Object.assign 会用 raw.chunks 覆盖 d.chunks
  const presetChunks=d.chunks, presetQ=d.extQuestions;
  // 顶层字段合并
  state=Object.assign(d,raw);
  state.settings=Object.assign({theme:"light",supabaseUrl:"",supabaseAnonKey:"",
    menuExpanded:{},navOrderV2:{}},raw.settings||{});
  state.settings.menuExpanded=Object.assign({},(raw.settings&&raw.settings.menuExpanded)||{});
  state.settings.navOrderV2=Object.assign({},(raw.settings&&raw.settings.navOrderV2)||{});
  state.daily=Object.assign({date:todayStr(),tasks:{}},raw.daily||{});
  state.daily.tasks=Object.assign({word:false,project:false,interview:false,review:false},(raw.daily&&raw.daily.tasks)||{});
  state.cloud=Object.assign(d.cloud,raw.cloud||{});
  // 词块：以预置为基准，按 id 回填用户字段；新增预置词块自动出现
  const oldChunks={};(raw.chunks||[]).forEach(c=>oldChunks[c.id]=c);
  state.chunks=presetChunks.map(p=>{
    const o=oldChunks[p.id];
    if(!o)return p;
    return Object.assign(p,{status:o.status,reviewCount:o.reviewCount,nextReview:o.nextReview,
      sentences:o.sentences||[],pronRating:o.pronRating||"",myExample:o.myExample||"",recUrl:o.recUrl||p.recUrl});
  });
  // 外企题：同理
  const oldQ={};(raw.extQuestions||raw.questions||[]).forEach(q=>oldQ[q.id]=q);
  state.extQuestions=presetQ.map(p=>{
    const o=oldQ[p.id];
    if(!o)return p;
    return Object.assign(p,{fav:!!o.fav,practiced:!!o.practiced,myAnswer:o.myAnswer||o.answer||"",status:o.status||"未准备",rating:o.rating||0});
  });
  // 用户自建项目/我的题库/手动条目直接保留
  state.projects=raw.projects||d.projects;
  state.myQuestions=raw.myQuestions||[];
  state.listening=raw.listening||d.listening;
  state.plan=raw.plan||d.plan;
  state.regsLocal=raw.regsLocal||d.regsLocal;
  state.dailyManual=raw.dailyManual||[];
  state.checklist=raw.checklist||{};
  state.sentenceCount=raw.sentenceCount||0;
  // 新增模块字段（旧数据缺失时使用默认值）
  state.jobApps=Array.isArray(raw.jobApps)?raw.jobApps:[];
  state.targetFav=raw.targetFav||{};
  state.wordStudy=Object.assign(d.wordStudy,raw.wordStudy||{});
  // 翻译练习：合并用户数据（收藏/错题/历史），缺字段用默认
  state.transStudy=Object.assign(d.transStudy,raw.transStudy||{});
  state.transStudy.fav=Object.assign({},(raw.transStudy&&raw.transStudy.fav)||{});
  state.transStudy.wrong=Object.assign({},(raw.transStudy&&raw.transStudy.wrong)||{});
  state.wordStudy.progress=(raw.wordStudy&&raw.wordStudy.progress)||{};
  state.wordStudy.learnedDates=(raw.wordStudy&&raw.wordStudy.learnedDates)||{};
  // 跨天重置每日任务
  if(state.daily.date!==todayStr())state.daily={date:todayStr(),tasks:{word:false,project:false,interview:false,review:false}};
  saveState();
}
function saveState(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){console.warn(e);}}

/* ---------- 打卡与连续天数 ---------- */
function checkin(){
  const t=todayStr();
  if(state.lastCheck===t){toast("今天已经打卡过了");return;}
  if(state.lastCheck&&daysBetween(state.lastCheck,t)===1)state.streak+=1;
  else state.streak=1;
  state.lastCheck=t;
  state.checkins.push(t);
  saveState();toast("打卡成功，连续 "+state.streak+" 天");renderDashboard();
}
/* 标记今日任务并自动保存 */
function toggleDailyTask(k){
  state.daily.tasks[k]=!state.daily.tasks[k];saveState();renderDashboard();
}

/* ---------- 间隔重复：复习词块 ---------- */
function reviewChunk(id,rating){
  const c=state.chunks.find(x=>x.id===id);if(!c)return;
  if(rating){c.pronRating=rating;}
  c.reviewCount=(c.reviewCount||0)+1;
  const idx=Math.min(c.reviewCount-1,SRS_INTERVALS.length-1);
  c.nextReview=addDays(todayStr(),SRS_INTERVALS[idx]);
  c.status=c.reviewCount>=3?"已掌握":(c.reviewCount>=1?"学习中":"未学");
  state.daily.tasks.word=true;
  saveState();
}

  const dark=state.settings.theme==="dark";
  document.documentElement.classList.toggle("dark",dark);
  $("#btnTheme").textContent=dark?"☀️":"🌙";
}
$("#btnTheme").addEventListener("click",()=>{
  state.settings.theme=state.settings.theme==="dark"?"light":"dark";
  saveState();applyTheme();
});

/* 视图 → 所属一级分组 / 名称 */
function viewMeta(v){
  for(const g of DEFAULT_GROUPS){const f=g.items.find(i=>i[0]===v);
    if(f)return {group:g.id,label:f[1]};}
  return {group:"",label:v};
}
/* 读取某组二级模块顺序（用户自定义优先） */
function groupOrder(g){
  const custom=state.settings.navOrderV2[g.id];
  const def=g.items.map(i=>i[0]);
  if(!custom||!custom.length)return def;
  // 以自定义为基础，补齐新增模块，剔除已不存在的 id
  const merged=custom.filter(id=>def.includes(id));
  def.forEach(id=>{if(!merged.includes(id))merged.push(id);});
  return merged;
}
/* 渲染整个分组侧边栏 */
function renderNavGroups(){
  const nav=$("#nav");
  const editing=nav.classList.contains("nav-editing");
  nav.innerHTML=DEFAULT_GROUPS.map(g=>{
    const collapsed=state.settings.menuExpanded[g.id]===false;
    const order=groupOrder(g);
    return `<div class="nav-group ${collapsed?"collapsed":""}" data-group="${g.id}">
      <button class="nav-group-head" data-group-head="${g.id}">
        <span>${g.name}</span><span class="arrow">▾</span></button>
      <div class="nav-items">
        ${order.map(id=>{const f=g.items.find(i=>i[0]===id);if(!f)return"";
          return `<button data-view="${id}" draggable="${editing}">${f[1]}
            ${editing?'<span class="mv up" data-mv="up" title="上移">▲</span><span class="mv dn" data-mv="down" title="下移">▼</span>':""}</button>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");
  markActiveNav(currentViewId());
}
/* 当前激活视图 id */
function currentViewId(){
  const b=document.querySelector(".nav-items button.active");
  return b?b.dataset.view:"dashboard";
}
/* 高亮当前二级模块并展开其一级分组 */
function markActiveNav(v){
  document.querySelectorAll(".nav-items button").forEach(b=>
    b.classList.toggle("active",b.dataset.view===v));
  const m=viewMeta(v);
  if(m.group){
    const g=document.querySelector('.nav-group[data-group="'+m.group+'"]');
    if(g)g.classList.remove("collapsed");
  }
}
function switchView(v){
  $$(".view").forEach(s=>s.classList.toggle("active",s.id==="view-"+v));
  markActiveNav(v);
  if(RENDERERS[v])RENDERERS[v]();
  window.scrollTo(0,0);
  updateHash(v);
}
/* hash 路由：#/viewId */
function updateHash(v){
  const h="#/"+v;
  if(location.hash!==h)history.replaceState(null,"",h);
}
function viewFromHash(){
  const raw=(location.hash||"").replace(/^#\/?/,"").trim();
  if(!raw)return "";
  return ROUTE_ALIAS[raw]||raw;
}
/* 导航点击：一级分组折叠 / 二级模块切换（编辑模式下只处理 ▲▼） */
$("#nav").addEventListener("click",e=>{
  const head=e.target.closest("[data-group-head]");
  if(head){
    if($("#nav").classList.contains("nav-editing"))return;
    const gid=head.dataset.groupHead;
    const g=document.querySelector('.nav-group[data-group="'+gid+'"]');
    const collapsed=!g.classList.contains("collapsed");
    g.classList.toggle("collapsed",collapsed);
    state.settings.menuExpanded[gid]=!collapsed;saveState();
    return;
  }
  if($("#nav").classList.contains("nav-editing"))return;
  const b=e.target.closest("button[data-view]");
  if(b)switchView(b.dataset.view);
});
/* 浏览器前进/后退 */
window.addEventListener("hashchange",()=>{
  const v=viewFromHash();
  if(v&&v!==currentViewId())switchView(v);
});
/* 顶部全局搜索按钮 */
document.addEventListener("click",e=>{
  if(e.target.closest("#btnSearch"))switchView("search");
});

/* ---------- 键盘快捷键：空格打卡 / N 下一题 / R 随机复习 ---------- */
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable)return;
  if($("#modalBg").classList.contains("open"))return;
  if(e.code==="Space"){e.preventDefault();checkin();}
  else if(e.key==="n"||e.key==="N"){nextPracticeItem();}
  else if(e.key==="r"||e.key==="R"){randomReview();}
});
/* N / R 的具体行为由渲染模块实现，这里给兜底 */
function nextPracticeItem(){
  const v=$$(".nav button").find(b=>b.classList.contains("active")).dataset.view;
  if(v==="extq"&&window.extNext){window.extNext();}
  else if(v==="myq"&&window.myqNext){window.myqNext();}
  else if(v==="chunks"&&window.chunkNext){window.chunkNext();}
  else if(v==="trans"&&window.transNext){window.transNext();}
  else {randomReview();}
}
function randomReview(){
  // 优先抽取今日到期的复习词，其次未掌握词，最后全部词
  let pool=state.chunks.filter(c=>c.nextReview&&c.nextReview<=todayStr());
  if(!pool.length)pool=state.chunks.filter(c=>c.status!=="已掌握");
  if(!pool.length)pool=state.chunks;
  const c=pool[Math.floor(Math.random()*pool.length)];
  chunkUI.cat="";chunkUI.lv="";chunkUI.status="";chunkUI.q="";
  switchView("chunks");
  setTimeout(()=>chunkFocus(c.id),50);
}

/* =====================================================================
 * Supabase REST 兼容层（可选：未配置则完全使用本地数据）
 * ===================================================================== */
const SUPABASE_URL=state?state.settings.supabaseUrl:"";   // 形如 https://xxxx.supabase.co
const SUPABASE_ANON_KEY=state?state.settings.supabaseAnonKey:""; // anon / publishable key
/* 通用读取：table=表名，query={select:'*',limit:50,...} */
async function loadData(table,query){
  if(!state.settings.supabaseUrl||!state.settings.supabaseAnonKey)throw new Error("未配置 Supabase");
  const qs=new URLSearchParams();
  Object.entries(query||{}).forEach(([k,v])=>qs.set(k,v));
  const res=await fetch(state.settings.supabaseUrl+"/rest/v1/"+table+"?"+qs.toString(),{
    headers:{apikey:state.settings.supabaseAnonKey,
      Authorization:"Bearer "+state.settings.supabaseAnonKey}
  });
  if(!res.ok)throw new Error("HTTP "+res.status);
  return res.json();
}
/* 拉取后端每日抓取数据；任何失败都静默降级到本地 */
async function refreshAll(){
  try{
    const [regulations,literature,jobs,trials,questions]=await Promise.all([
      loadData("regulations",{select:"*",order:"created_at.desc",limit:"50"}),
      loadData("literature",{select:"*",order:"created_at.desc",limit:"80"}),
      loadData("jobs",{select:"*",order:"created_at.desc",limit:"50"}),
      loadData("daily_updates",{select:"*",order:"created_at.desc",limit:"60"}),
      loadData("interview_questions",{select:"*",order:"created_at.desc",limit:"50"})
    ]);
    state.cloud={fetchedAt:new Date().toISOString(),regulations,literature,jobs,trials,questions};
    saveState();
    if(RENDERERS.daily&&$$(".view").find(s=>s.classList.contains("active")).id==="view-daily")RENDERERS.daily();
  }catch(e){
    console.warn("[Supabase] 使用本地数据：",e.message);
  }
}
/* 配置入口在每日更新中心提供；每 5 分钟自动刷新 */
setInterval(refreshAll,5*60*1000);

async function recStart(getObj){

  try{await Recorder.start();window._recObj=getObj;toast("正在录音…");}
  catch(e){toast("无法访问麦克风");}
}
async function recStop(){
  if(!Recorder.rec)return;
  const url=await Recorder.stop();
  if(window._recObj){window._recObj.recUrl=url;saveState();toast("录音已保存");}
}

/* ====================== 词块学习 ===================== */
function chunkMatch(c){
  if(chunkUI.cat&&c.cat!==chunkUI.cat)return false;
  if(chunkUI.lv&&String(c.lv)!==chunkUI.lv)return false;
  if(chunkUI.status){
    if(chunkUI.status==="due"){if(!c.nextReview||c.nextReview>todayStr())return false;}
    else if(c.status!==chunkUI.status)return false;
  }
  if(chunkUI.q){const q=chunkUI.q.toLowerCase();
    if(!(c.en.toLowerCase().includes(q)||c.zh.includes(chunkUI.q)||c.ipa.includes(q)))return false;}
  return true;
}
function renderChunks(){
  const list=state.chunks.filter(chunkMatch);
  const mastered=state.chunks.filter(c=>c.status==="已掌握").length;
  $("#view-chunks").innerHTML=`
  <h2 class="page">专业词块练习 <span class="muted">（${state.chunks.length} 个，已掌握 ${mastered}）</span></h2>
  <div class="filterbar">
    <select id="fCat"><option value="">全部分类</option>${Object.entries(CHUNK_CATS).map(([k,v])=>`<option value="${k}" ${chunkUI.cat===k?"selected":""}>${v}</option>`).join("")}</select>
    <select id="fLv"><option value="">全部难度</option>${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${chunkUI.lv===k?"selected":""}>${v}</option>`).join("")}</select>
    <select id="fStatus"><option value="">全部状态</option><option value="未学">未学</option><option value="学习中">学习中</option><option value="已掌握">已掌握</option><option value="due">待复习</option></select>
    <input class="grow" id="fQ" placeholder="搜索英文 / 中文 / 音标" value="${esc(chunkUI.q)}">
    <button class="sm" data-act="chunkRandom">随机抽词</button>
  </div>
  <div id="chunkList">
    ${list.slice(0,120).map(c=>chunkCard(c)).join("")}
    ${list.length>120?`<p class="muted">仅显示前 120 条，请用筛选或搜索缩小范围（共 ${list.length} 条）</p>`:""}
    ${!list.length?'<p class="muted">没有匹配的词块</p>':""}
  </div>`;
  /* 绑定筛选 */
  $("#fCat").onchange=e=>{chunkUI.cat=e.target.value;renderChunks();};
  $("#fLv").onchange=e=>{chunkUI.lv=e.target.value;renderChunks();};
  $("#fStatus").onchange=e=>{chunkUI.status=e.target.value;renderChunks();};
  $("#fQ").oninput=e=>{chunkUI.q=e.target.value;clearTimeout(window._ft);window._ft=setTimeout(renderChunks,300);};
  if(chunkUI.focusId){const el=document.getElementById("chunk-"+chunkUI.focusId);if(el){el.scrollIntoView({block:"center"});el.style.boxShadow="0 0 0 2px var(--brand)";chunkUI.focusId="";}}
}

function chunkFocus(id){chunkUI.focusId=id;renderChunks();}
function chunkNext(){
  /* 未掌握词块中顺序下一个 */
  const pool=state.chunks.filter(c=>c.status!=="已掌握");
  const c=pool[Math.floor(Math.random()*pool.length)];

/* 文件上传：document 级事件委托，renderProjects 重渲染后依然有效 */
function bindProjectFile(){
  if(bindProjectFile._bound)return;bindProjectFile._bound=true;
  document.addEventListener("change",async e=>{
    const inp=e.target;
    if(!inp)return;
    /* 方案文件（PDF/DOCX/TXT/MD） */
    if(inp.id==="projFile"){
      const file=inp.files[0];if(!file)return;inp.value="";
      const lower=file.name.toLowerCase();
      if(lower.endsWith(".txt")||lower.endsWith(".md")){
        const txt=await file.text();openParsedForm(parseStudyText(txt));
      }else if(lower.endsWith(".pdf")){
        toast("正在尝试解析 PDF…");
        try{
          const lib=await ensurePdfJs();
          const buf=await file.arrayBuffer();
          const doc=await lib.getDocument({data:buf}).promise;
          let txt="";
          for(let i=1;i<=Math.min(doc.numPages,30);i++){const pg=await doc.getPage(i);const c=await pg.getTextContent();txt+=c.items.map(it=>it.str).join(" ")+"\n";}
          openParsedForm(parseStudyText(txt));
        }catch(err){openPasteModal("PDF 解析器未能加载或解析失败（"+err.message+"），请复制方案文本到下方文本框：");}
      }else if(lower.endsWith(".docx")||lower.endsWith(".doc")){
        toast("正在解析 Word 文档…");
        try{
          const lib=await ensureMammoth();
          const buf=await file.arrayBuffer();
          const out=await lib.extractRawText({arrayBuffer:buf});
          if(out&&out.value&&out.value.trim())openParsedForm(parseStudyText(out.value));
          else openPasteModal("未能从该 Word 提取文字（旧版 .doc 可能不支持），请复制文档文本到下方文本框：");
        }catch(err){openPasteModal("Word 解析器加载或解析失败，请复制文档文本到下方文本框：");}
      }else openPasteModal("请复制方案文本到下方文本框：");
    }
    /* JSON 导入项目 */
    else if(inp.id==="projJsonFile"){
      const file=inp.files[0];if(!file)return;inp.value="";
      const r=new FileReader();
      r.onload=()=>{try{
        const data=JSON.parse(r.result);
        const arr=Array.isArray(data)?data:(data.projects||[]);
        arr.forEach(x=>{if(x&&x.name)state.projects.push(Object.assign(makeProject(x),x,{id:uid("p")}));});
        saveState();renderProjects();toast("已导入 "+arr.length+" 个项目");
      }catch(err){toast("JSON 导入失败");}};
      r.readAsText(file);
    }
  });
}
/* 通用 CDN 脚本加载：依次尝试多个源，全部失败才 reject */
function loadCdnScript(urls){
  return new Promise((resolve,reject)=>{
    let i=0;
    const tryNext=()=>{
      if(i>=urls.length)return reject(new Error("所有 CDN 源均加载失败"));
      const u=urls[i++],s=document.createElement("script");
      s.src=u.src;s.async=true;
      s.onload=()=>{try{if(u.after)u.after();resolve();}catch(e){reject(e);}};
      s.onerror=()=>{s.remove();tryNext();};
      document.head.appendChild(s);
    };
    tryNext();
  });
}
/* pdf.js：多 CDN 回退（cdnjs → jsdelivr → unpkg） */
function ensurePdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  const v="3.11.174";
  const hosts=[
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/"+v,
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@"+v+"/build",
    "https://unpkg.com/pdfjs-dist@"+v+"/build"
  ];
  return loadCdnScript(hosts.map(h=>({src:h+"/pdf.min.js",
    after:()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=h+"/pdf.worker.min.js";}})))
    .then(()=>window.pdfjsLib);
}
/* mammoth：解析 Word(.docx) 纯文本，多 CDN 回退 */
function ensureMammoth(){
  if(window.mammoth)return Promise.resolve(window.mammoth);
  const v="1.6.0";
  const urls=[
    {src:"https://cdnjs.cloudflare.com/ajax/libs/mammoth/"+v+"/mammoth.browser.min.js"},
    {src:"https://cdn.jsdelivr.net/npm/mammoth@"+v+"/mammoth.browser.min.js"},
    {src:"https://unpkg.com/mammoth@"+v+"/mammoth.browser.min.js"}
  ];
  return loadCdnScript(urls).then(()=>window.mammoth);
}

/* --- 文本解析：关键词匹配提取项目信息 --- */
function findFirst(text,regex){const m=text.match(regex);return m?(m[1]||m[2]||m[3]||m[0]):"";}
function parseStudyText(text){
  const f={name:"",codeNo:"",indication:"",phase:"",target:"",isotope:"",sites:"",enrollment:"",role:"CRA（监查）",period:""};
  /* 名称：含 Protocol / 方案 / Study Title 的行，否则取首个非空行；去掉标签前缀并截到句末 */
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let titleLine=lines.find(l=>/protocol|方案|study title|clinical study|临床试验/i.test(l));
  titleLine=(titleLine||lines[0]||"未命名项目")
    .replace(/^\s*(?:study\s*title|protocol\s*title|方案名称|项目名称)\s*[:：]?/i,"")
    .split(/\.\s|。/)[0];
  f.name=titleLine.slice(0,120);
  f.codeNo=findFirst(text,/(?:protocol\s*(?:number|no\.?)|方案编号?)[:\s]*([A-Za-z0-9\-]{3,})/i);
  /* 靶点 */
  const targetMap=[["PSMA",/PSMA|prostate-specific membrane antigen/i],["CAIX",/CAIX|CA-IX|carbonic anhydrase\s*IX/i],
    ["CD73",/CD73/],["Nectin-4",/Nectin-4/],["SSTR2",/SSTR2|somatostatin receptor\s*2/i],
    ["FAP",/\bFAP\b|fibroblast activation protein/i],["GRPR",/GRPR|gastrin-releasing peptide receptor/i],
    ["HER2",/HER2|HER-2/],["EGFR",/EGFR/],["C-MET",/c-MET/],["CXCR4",/CXCR4/],
    ["CLDN18.2",/CLDN18\.2/],["MSLN",/mesothelin/],["GD2",/\bGD2\b/],["BRCA1/2",/BRCA/],["PIK3CA",/PIK3CA/]];
  const t=targetMap.find(x=>x[1].test(text));if(t)f.target=t[0];
  /* 核素 */
  const isoMap=[["Ga-68",/Ga-68|gallium-68/i],["F-18",/F-18|fluorine-18/i],["Lu-177",/Lu-177|lutetium-177/i],
    ["Cu-64",/Cu-64|copper-64/i],["Zr-89",/Zr-89|zirconium-89/i],["I-131",/I-131|iodine-131/i],
    ["Ac-225",/Ac-225|actinium-225/i],["Tc-99m",/Tc-99m|technetium-99m/i],["Y-90",/Y-90|yttrium-90/i]];
  const iso=isoMap.find(x=>x[1].test(text));if(iso)f.isotope=iso[0];
  /* 分期 */
  if(/Phase\s*III|III\s*期|三期/.test(text))f.phase="III 期";
  else if(/Phase\s*II|II\s*期|二期/.test(text))f.phase="II 期";
  else if(/Phase\s*I\b|I\s*期|一期/.test(text))f.phase="I 期";
  else if(/\bIIT\b|investigator-initiated/.test(text))f.phase="IIT";
  else if(/software|软件|SaMD/.test(text))f.phase="器械注册";
  else if(/reagent|试剂|IVD/.test(text))f.phase="IVD 注册";
  else if(/注册检验/.test(text))f.phase="注册检验";
  else if(/pharmacokinetic|\bPK\b/.test(text))f.phase="PK 研究";
  /* 适应症 */
  const indMap=[["前列腺癌",/prostate|前列腺/],["肾细胞癌",/renal|kidney|肾/],["胰腺癌",/pancreatic|胰腺/],
    ["胃癌",/gastric|stomach|胃/],["尿路上皮癌",/urothelial|膀胱/],["乳腺癌",/breast|乳腺/],
    ["甲状腺癌",/thyroid|甲状腺/],["神经内分泌肿瘤",/neuroendocrine/]];
  const ind=indMap.find(x=>x[1].test(text));if(ind)f.indication=ind[0];
  /* 中心数 / 入组数 */
  f.sites=findFirst(text,/(\d+)\s*(?:个)?(?:中心|sites?)/)||"";
  f.enrollment=findFirst(text,/(\d+)\s*(?:例|subjects?|patients)/)||"";
  return f;
}

/* =====================================================================
 * 全局事件分发（data-act 按钮统一处理）
 * ===================================================================== */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const d=b.dataset,id=d.id;
  const curView=()=>{const v=document.querySelector(".view.active");return v?v.id.replace("view-",""):"dashboard";};
  const rerender=()=>{const fn=RENDERERS[curView()];if(fn)fn();};
  switch(d.act){
    /* 仪表盘 / 打卡 */
    case "checkin":checkin();renderDashboard();break;
    case "dailyTask":toggleDailyTask(d.k);renderDashboard();break;
    /* 每日中心 */
    case "cloudRefresh":
      if(!state.settings.supabaseUrl){openSupabaseConfig();}
      else{toast("正在拉取云端数据…");await refreshAll();renderDaily();}
      break;
    case "dailyAdd":openDailyAdd();break;
    case "checklist":state.checklist[d.key]=!state.checklist[d.key];saveState();renderDaily();break;
    /* 朗读（统一走 toggleSpeak，朗读中可停止） */
    case "speak":toggleSpeak(b,d.text);break;
    case "speakSlow":toggleSpeak(b,d.text,0.7);break;
    /* 词块 */
    case "chunkRandom":randomReview();break;
    case "chunkDetail":{const box=$("#cd-"+id);
      if(box){box.classList.toggle("hide");if(!box.innerHTML){box.innerHTML=chunkDetailHtml(state.chunks.find(c=>c.id===id));}}
      break;}
    case "chunkPron":{const c=state.chunks.find(x=>x.id===id);c.pronRating=d.r;saveState();
      const box=$("#cd-"+id);if(box&&!box.classList.contains("hide"))box.innerHTML=chunkDetailHtml(c);break;}
    case "chunkStatus":{const c=state.chunks.find(x=>x.id===id);c.status=d.s;saveState();
      const box=$("#cd-"+id);if(box&&!box.classList.contains("hide"))box.innerHTML=chunkDetailHtml(c);
      renderChunks();break;}
    case "chunkSaveEx":{const c=state.chunks.find(x=>x.id===id);const v=$("#myex-"+id).value.trim();
      if(v){c.myExample=v;if(!c.sentences)c.sentences=[];if(!c.sentences.includes(v))c.sentences.push(v);state.sentenceCount++;}
      saveState();toast("造句已保存");const box=$("#cd-"+id);if(box)box.innerHTML=chunkDetailHtml(c);break;}
    case "chunkReview":reviewChunk(id);toast("已记录一次复习");renderChunks();break;
    /* 录音 */
    case "rec":{
      if(d.ctx==="chunk")window._recObj=state.chunks.find(x=>x.id===id);
      else if(d.ctx==="project")window._recObj=state.projects.find(x=>x.id===id);
      else if(d.ctx==="listening")window._recObj=state.listening[Number(id)];
      await recStart(window._recObj);break;}
    case "recStop":await recStop();rerender();break;
    /* 造句训练 */
    case "sentenceSave":{const v=$("#sentenceInput").value.trim();if(!v){toast("请先输入句子");break;}
      const c=sentenceCur;if(!c.sentences)c.sentences=[];c.sentences.push(v);state.sentenceCount++;
      if(d.r==="好")c.status=c.status==="未学"?"学习中":c.status;
      saveState();toast("已保存（自评："+d.r+"）");pickSentenceChunk();renderSentence();break;}
    case "sentenceNext":pickSentenceChunk();renderSentence();break;
    /* 项目库 */
    case "projectNew":projectNewForm();break;
    case "projectUpload":{const f=$("#projFile");if(f)f.click();break;}
    case "projectJSON":{const f=$("#projJsonFile");if(f)f.click();break;}
    case "projectOpen":projectOpen(id);break;
    case "projectDelete":if(confirm("确认删除该项目？相关已生成的面试题不会被删除。")){
      state.projects=state.projects.filter(p=>p.id!==id);saveState();renderProjects();}break;
    case "projectConfirm":{const f=readFormFields();if(!f.name){toast("请至少填写项目名称");break;}
      state.projects.push(makeProject(f));saveState();closeModal();renderProjects();break;}

/* 解析 JWT payload（不验证签名，仅用于识别角色） */
function jwtRole(token){
  try{
    const part=token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    const json=decodeURIComponent(Array.prototype.map.call(atob(part),
      c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    const o=JSON.parse(json);
    return o.role||(o.app_metadata&&o.app_metadata.role)||"";
  }catch(e){return "";}
}
/* 检测是否误填 service_role key */
function isServiceKey(key){
  if(!key)return false;
  const role=jwtRole(key);
  if(String(role).includes("service_role"))return true;
  // 启发式：JWT 且异常长（anon 通常较短，service_role 常 >180）
  if(key.startsWith("eyJhbGci")&&key.length>180)return true;
  return false;
}

/* 配置弹窗内的按钮（事件委托） */
document.addEventListener("click",async e=>{
  const eye=e.target.closest('[data-act="sbEye"]');
  if(eye){
    const inp=$("#sbAnon");const show=inp.type==="password";
    inp.type=show?"text":"password";eye.textContent=show?"隐藏":"显示";
    return;
  }
  const clr=e.target.closest('[data-act="sbClear"]');
  if(clr){
    state.settings.supabaseUrl="";state.settings.supabaseAnonKey="";
    saveState();closeModal();renderDaily();toast("已清空 Supabase 配置，继续使用本地数据");
    return;
  }
  const b=e.target.closest('[data-act="sbSave"]');if(!b)return;
  const url=$("#sbUrl").value.trim(),key=$("#sbAnon").value.trim();
  if(key&&isServiceKey(key)){
    const box=document.querySelector(".security-tip");
    const warn=document.createElement("div");
    warn.className="security-warn";
    warn.innerHTML="🚨 警告！切勿在前端填入 service_role key，请立即前往 Supabase 控制台重置 API Key，并换成 anon key！";
    box.after(warn);
    toast("已阻止保存：检测到 service_role key");
    return;
  }
  state.settings.supabaseUrl=url;state.settings.supabaseAnonKey=key;
  saveState();closeModal();toast("配置已保存");
  if(url&&key){try{await refreshAll();}catch(err){toast("拉取失败，已保留本地数据");}}
  renderDaily();
});

/* 当前方向下、经筛选的条文池 */
function transPool(){
  const ts=state.transStudy;
  const wantLang=ts.dir==="zh2en"?"zh":"en";
  const q=ts.q.toLowerCase();
  return TRANS_ITEMS.filter(it=>{
    if(it.originalLang!==wantLang)return false;
    if(ts.filterCat&&it.category!==ts.filterCat)return false;
    if(ts.filterSrc&&it.source!==ts.filterSrc)return false;
    if(ts.filterLv&&String(it.lv)!==ts.filterLv)return false;
    if(q&&!(it.originalText.toLowerCase().includes(q)
      ||it.referenceTranslation.includes(ts.q)
      ||it.source.toLowerCase().includes(q)))return false;
    return true;
  });
}
/* 统计：已自评条数、正确率（好=正确）、收藏、错题 */
function transStats(){
  const ts=state.transStudy;
  const ids=Object.keys(ts.ratings);
  const good=ids.filter(id=>ts.ratings[id]===3).length;
  return {practiced:ids.length,acc:ids.length?Math.round(good/ids.length*100):0,
    good,fav:Object.keys(ts.fav).length,wrong:Object.keys(ts.wrong).length};
}
/* 参考译文中高亮关键术语：用户译文中出现=绿（译对），缺失=橙（漏译） */
function highlightRef(it,userText){
  let html=esc(it.referenceTranslation);
  for(let i=0;i<it.keyTerms.length;i+=2){
    const a=it.keyTerms[i],b=it.keyTerms[i+1];
    // 自动识别一对术语里哪个是中文、哪个是英文
    const aIsZh=/[\u4e00-\u9fff]/.test(a);
    const enTerm=aIsZh?b:a, zhTerm=aIsZh?a:b;
    const term=it.originalLang==="zh"?enTerm:zhTerm; // 目标语术语
    if(!term)continue;
    const hit=userText.toLowerCase().includes(term.toLowerCase());
    const marked='<mark class="'+(hit?"term-hit":"term-miss")+'">'+esc(term)+"</mark>";
    html=html.split(esc(term)).join(marked);   // 字面量替换全部出现
  }
  return html;
}

  if($("#trLv"))$("#trLv").onchange=e=>{ts.filterLv=e.target.value;ts.submitted=false;renderTrans();};
  if($("#trQ"))$("#trQ").oninput=e=>{ts.q=e.target.value;clearTimeout(window._trq);

/* 下一题（随机，避免连重） */
window.transNext=function(){
  const ts=state.transStudy,p=transPool();
  if(!p.length){toast("当前筛选下没有更多条文");return;}
  let next;do{next=p[Math.floor(Math.random()*p.length)];}
  while(p.length>1&&next.id===ts.curId);
  ts.curId=next.id;ts.submitted=false;ts.draft="";
  renderTrans();
};
/* 翻译模块按钮事件委托 */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act^=trans]");if(!b)return;
  const ts=state.transStudy,act=b.dataset.act;
  if(act==="transDir"){ts.dir=b.dataset.v;ts.curId="";ts.submitted=false;ts.draft="";renderTrans();}
  else if(act==="transTab"){ts.tab=b.dataset.v;renderTrans();}
  else if(act==="transGo"){ts.curId=b.dataset.id;ts.tab="practice";ts.submitted=false;ts.draft="";renderTrans();}
  else if(act==="transSubmit"){
    const t=($("#transInput")||{}).value;
    if(!t||!t.trim()){toast("请先输入译文再提交");return;}
    ts.draft=t.trim();ts.submitted=true;saveState();renderTrans();toast("已对照参考译文");
  }else if(act==="transRate"){
    const id=ts.curId,v=Number(b.dataset.v);
    ts.ratings[id]=v;
    ts.history.push({date:todayStr(),id,dir:ts.dir,rating:v});
    if(v<3)ts.wrong[id]=true;else delete ts.wrong[id];
    saveState();renderTrans();
    toast(["","已记录：差，已加入错题本","已记录：一般，已加入错题本","已记录：好，很棒！"][v]);
  }else if(act==="transFav"){
    const id=b.dataset.id;
    if(ts.fav[id]){delete ts.fav[id];toast("已取消收藏");}
    else{ts.fav[id]=true;toast("已收藏，可在收藏夹集中复习");}
    saveState();renderTrans();
  }else if(act==="transNext"){window.transNext();}
  else if(act==="transSpeak"){
    const it=TRANS_ITEMS.find(x=>x.id===b.dataset.id);if(!it)return;
    const text=b.dataset.which==="orig"?it.originalText:it.referenceTranslation;
    const lang=b.dataset.which==="orig"
      ?(it.originalLang==="zh"?"zh-CN":"en-US")
      :(it.originalLang==="zh"?"en-US":"zh-CN");
    speakLang(text,lang);
  }
});

/* =====================================================================
 * 模块：常规背单词（医学 / 雅思；卡片、选择、拼写、听音选词、SRS）
