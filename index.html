<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>核药CRA英文训练舱</title>
<style>
/* ============================================================
   主题变量（浅色 / 深色）
   ============================================================ */
:root{
  --bg:#f4f7f8; --surface:#ffffff; --surface-2:#eef3f4;
  --text:#1f2937; --muted:#6b7280; --border:#dbe3e5;
  --primary:#0f766e; --primary-soft:#ccfbf1; --primary-contrast:#ffffff;
  --accent:#b45309; --danger:#b91c1c; --danger-soft:#fee2e2;
  --good:#15803d; --good-soft:#dcfce7; --warn:#a16207; --warn-soft:#fef9c3;
  --shadow:0 2px 10px rgba(15,23,42,.06);
}
body.dark{
  --bg:#0f172a; --surface:#1e293b; --surface-2:#273449;
  --text:#e2e8f0; --muted:#94a3b8; --border:#334155;
  --primary:#2dd4bf; --primary-soft:#134e4a; --primary-contrast:#06231f;
  --accent:#fbbf24; --danger:#f87171; --danger-soft:#4c1d1d;
  --good:#4ade80; --good-soft:#14361f; --warn:#facc15; --warn-soft:#3a3312;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
}
/* ============================================================
   顶部栏
   ============================================================ */
header.topbar{
  position:sticky; top:0; z-index:50;
  background:var(--surface); border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding:10px 16px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.brand{font-size:18px; font-weight:700; color:var(--primary); margin-right:auto; white-space:nowrap;}
.brand small{display:block; font-size:11px; color:var(--muted); font-weight:400;}
.top-actions{display:flex; gap:6px; flex-wrap:wrap;}
button{
  font-family:inherit; font-size:14px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:7px 12px; border-radius:8px; transition:.15s;
}
button:hover{border-color:var(--primary); color:var(--primary);}
button.primary{background:var(--primary); color:var(--primary-contrast); border-color:var(--primary);}
button.primary:hover{opacity:.9; color:var(--primary-contrast);}
button.danger{color:var(--danger); border-color:var(--danger);}
button.sm{padding:4px 9px; font-size:13px;}
button.block{width:100%;}
button[disabled]{opacity:.5; cursor:not-allowed;}
/* ============================================================
   导航
   ============================================================ */
nav.tabs{
  background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:57px; z-index:40;
}
.tabs-inner{
  max-width:1180px; margin:0 auto; padding:0 10px;
  display:flex; gap:4px; overflow-x:auto; scrollbar-width:none;
}
.tabs-inner::-webkit-scrollbar{display:none;}
.tab{
  border:none; background:transparent; white-space:nowrap;
  padding:12px 13px; border-bottom:3px solid transparent; border-radius:0;
  color:var(--muted); font-size:14px;
}
.tab:hover{color:var(--primary);}
.tab.active{color:var(--primary); border-bottom-color:var(--primary); font-weight:600;}
/* ============================================================
   布局
   ============================================================ */
main{max-width:1180px; margin:0 auto; padding:20px 16px 60px;}
.view{display:none;}
.view.active{display:block; animation:fade .2s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
.grid{display:grid; gap:14px;}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));}
.grid.cols-3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:16px; box-shadow:var(--shadow);
}
.card h3{margin:0 0 10px; font-size:16px;}
.section-title{font-size:20px; font-weight:700; margin:4px 0 14px;}
.muted{color:var(--muted); font-size:13px;}
.hint{color:var(--muted); font-size:12px; margin-top:6px;}
.en{font-family:Georgia,"Times New Roman",serif;}
.badge{
  display:inline-block; font-size:12px; padding:2px 9px; border-radius:999px;
  background:var(--surface-2); color:var(--muted); margin-right:6px;
}
.badge.cat{background:var(--primary-soft); color:var(--primary);}
.tag{
  display:inline-block; font-size:12px; padding:2px 8px; margin:2px 4px 2px 0;
  background:var(--surface-2); border-radius:6px; color:var(--text);
}
/* 输入控件 */
input[type=text],input[type=search],textarea,select{
  width:100%; font-family:inherit; font-size:14px; color:var(--text);
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:9px 11px; outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--primary);}
textarea{resize:vertical; min-height:70px;}
label.chk{display:flex; align-items:flex-start; gap:9px; cursor:pointer; padding:7px 4px;}
label.chk input{margin-top:4px; width:auto;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.toolbar input[type=search],.toolbar input[type=text]{max-width:280px;}
.filter-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.filter-row button.active{background:var(--primary); color:var(--primary-contrast); border-color:var(--primary);}
/* 仪表盘 */
.dash-hero{display:grid; grid-template-columns:1fr auto; gap:18px; align-items:center;}
.ring-wrap{position:relative; width:150px; height:150px; margin:0 auto;}
.ring{width:150px; height:150px; transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:var(--surface-2); stroke-width:11;}
.ring-fg{fill:none; stroke:var(--primary); stroke-width:11; stroke-linecap:round; transition:stroke-dashoffset .5s;}
.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-center b{font-size:26px;}
.stat-line{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px;}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; box-shadow:var(--shadow);}
.stat b{display:block; font-size:26px; color:var(--primary);}
.task-item{display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px dashed var(--border);}
.task-item:last-child{border-bottom:none;}
.task-item .min{margin-left:auto; color:var(--muted); font-size:13px; white-space:nowrap;}
.mini-check{
  width:22px; height:22px; border-radius:50%; border:2px solid var(--border);
  display:inline-flex; align-items:center; justify-content:center; font-size:13px;
  background:transparent; color:transparent; padding:0; flex:none;
}
.task-item.done .mini-check{background:var(--good); border-color:var(--good); color:#fff;}
.task-item.done .task-name{text-decoration:line-through; color:var(--muted);}
/* 词块卡片 */
.chunk-card .en-head{font-size:17px; font-weight:700; font-family:Georgia,serif;}
.status-row{display:flex; gap:6px; margin:10px 0; flex-wrap:wrap;}
.status-row button.active{background:var(--primary); color:var(--primary-contrast); border-color:var(--primary);}
.status-row button.s-good.active{background:var(--good); border-color:var(--good);}
.rate-row{display:flex; gap:8px; margin-top:10px;}
.rate-row button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
/* 条形图 */
.bar{height:14px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin:6px 0 12px;}
.bar-fill{height:100%; background:var(--primary); border-radius:999px; transition:width .6s;}
.bar-row{display:grid; grid-template-columns:130px 1fr 64px; gap:10px; align-items:center; font-size:13px;}
@media(max-width:560px){.bar-row{grid-template-columns:96px 1fr 56px;}}
/* 计时器 */
.timer{font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; text-align:center; letter-spacing:2px;}
.timer.small{font-size:30px;}
.star-tips{background:var(--surface-2); border-radius:10px; padding:10px 14px; font-size:13px;}
.star-tips b{color:var(--primary);}
/* 模态框 */
.modal-mask{
  position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:100;
  display:none; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto;
}
.modal-mask.show{display:flex;}
.modal{
  background:var(--surface); border-radius:14px; max-width:680px; width:100%;
  padding:20px; border:1px solid var(--border); box-shadow:0 12px 40px rgba(0,0,0,.3);
}
.modal-head{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.modal-head h3{margin:0; font-size:17px; flex:1;}
audio{width:100%; margin-top:8px;}
/* Toast */
#toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
  background:#111827; color:#fff; padding:10px 18px; border-radius:999px;
  font-size:14px; z-index:200; opacity:0; pointer-events:none; transition:.25s;
}
#toast.show{opacity:.95;}
.search-result{padding:10px 0; border-bottom:1px dashed var(--border);}
.search-result:last-child{border-bottom:none;}
.kw-chip{background:var(--primary-soft); color:var(--primary);}
.score-pick button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
footer.foot{max-width:1180px; margin:0 auto; padding:0 16px 30px; color:var(--muted); font-size:12px;}
</style>
</head>
<body>

<!-- ================= 顶部栏 ================= -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">核药CRA英文训练舱
      <small>Nuclear CRA English Training Cabin</small>
    </div>
    <div class="top-actions">
      <button class="sm" onclick="exportData()">导出 JSON</button>
      <button class="sm" onclick="document.getElementById('importFile').click()">导入 JSON</button>
      <button class="sm danger" onclick="resetData()">重置数据</button>
      <button class="sm primary" id="themeBtn" onclick="toggleTheme()">深色模式</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(event)" />
  </div>
</header>

<!-- ================= 导航 ================= -->
<nav class="tabs">
  <div class="tabs-inner" id="tabsInner">
    <button class="tab active" data-view="dashboard">首页仪表盘</button>
    <button class="tab" data-view="chunks">词块学习</button>
    <button class="tab" data-view="sentence">造句训练</button>
    <button class="tab" data-view="projects">项目口述</button>
    <button class="tab" data-view="interview">模拟面试</button>
    <button class="tab" data-view="answers">答案库</button>
    <button class="tab" data-view="listening">听力跟读</button>
    <button class="tab" data-view="plan">周计划</button>
    <button class="tab" data-view="stats">进度统计</button>
    <button class="tab" data-view="search">搜索</button>
  </div>
</nav>

<main>
  <!-- 各视图容器，内容由 JS 渲染 -->
  <section id="view-dashboard" class="view active"></section>
  <section id="view-chunks" class="view"></section>
  <section id="view-sentence" class="view"></section>
  <section id="view-projects" class="view"></section>
  <section id="view-interview" class="view"></section>
  <section id="view-answers" class="view"></section>
  <section id="view-listening" class="view"></section>
  <section id="view-plan" class="view"></section>
  <section id="view-stats" class="view"></section>
  <section id="view-search" class="view"></section>
</main>

<footer class="foot">
  快捷键：空格 = 一键打卡 ｜ N = 下一道面试题 ｜ R = 随机复习词块（输入框内不触发）。数据仅保存在本机浏览器。
</footer>

<!-- 通用模态框 -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div id="toast"></div>

/* ================================================================
   二、状态管理（localStorage）
   ================================================================ */
const LS_KEY="nuclearCraStudyApp";
let state=null;

function clone(o){return JSON.parse(JSON.stringify(o));}
function buildDefaultState(){
  return {
    appId:LS_KEY, version:1,
    settings:{theme:"light"},
    checkins:[], lastCheck:null, streak:0,
    daily:{date:"",tasks:{word:false,project:false,interview:false,review:false}},
    chunks:clone(PRESET_CHUNKS).map(c=>Object.assign({status:"未学",reviewCount:0,nextReview:"",sentence:"",sentences:[]},c)),
    questions:clone(PRESET_QUESTIONS).map(q=>Object.assign({answer:"",practices:[]},q)),
    projects:clone(PRESET_PROJECTS).map(p=>Object.assign({notes:"",score:0},p)),
    listening:clone(PRESET_LISTENING),
    plan:{}
  };
}
function loadState(){
  const base=buildDefaultState();
  let stored=null;
  try{stored=JSON.parse(localStorage.getItem(LS_KEY));}catch(e){stored=null;}
  if(!stored)return base;
  /* 按 id 合并预置集合：保留用户数据，同时自动加入后续新增预置内容 */
  function merge(presetArr,storedArr){
    const map={};
    (storedArr||[]).forEach(x=>{map[x.id]=x;});
    return presetArr.map(p=>map[p.id]?Object.assign({},p,map[p.id]):Object.assign({},p));
  }
  base.chunks=merge(base.chunks,stored.chunks);
  base.questions=merge(base.questions,stored.questions);
  base.projects=merge(base.projects,stored.projects);
  base.listening=merge(base.listening,stored.listening);
  base.checkins=stored.checkins||[];
  base.lastCheck=stored.lastCheck||null;
  base.streak=stored.streak||0;
  base.daily=stored.daily||base.daily;
  base.plan=stored.plan||{};
  base.settings=Object.assign(base.settings,stored.settings||{});
  return base;
}
function saveState(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}
  catch(e){toast("保存失败：存储空间可能不足");}
}

function pad2(n){return String(n).padStart(2,"0");}
function fmtClock(sec){return pad2(Math.floor(sec/60))+":"+pad2(sec%60);}
function todayStr(){
  const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function addDays(dateStr,n){
  const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function ensureDaily(){
  if(state.daily.date!==todayStr())
    state.daily={date:todayStr(),tasks:{word:false,project:false,interview:false,review:false}};
}
let toastTimer=null;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}

/* ================================================================
   六、词块学习
   ================================================================ */
let chunkFilter="all", chunkSearch="";
function setChunkFilter(cat){chunkFilter=cat;renderChunks();}
function setChunkSearch(v){chunkSearch=v.trim().toLowerCase();renderChunks();}
function setChunkStatus(id,status){
  const c=state.chunks.find(x=>x.id===id); if(!c)return;
  c.status=status; saveState(); renderChunks();
  toast(status==="已掌握"?"已标记为掌握，继续保持":"状态已更新");
}
function saveChunkSentence(id,val){
  const c=state.chunks.find(x=>x.id===id); if(!c)return;
  c.sentence=val; saveState();
}
function reviewChunk(id){
  const c=state.chunks.find(x=>x.id===id); if(!c)return;
  const gap=SRS_INTERVALS[Math.min(c.reviewCount,SRS_INTERVALS.length-1)];
  c.nextReview=addDays(todayStr(),gap);
  c.reviewCount++;
  if(c.status==="未学")c.status="学习中";
  saveState(); renderChunks();
  toast(`已复习，下次复习：${c.nextReview}（${gap} 天后）`);
}
function pickRandomChunk(){
  /* 优先：到期且未掌握；其次：未掌握；最后：全部 */
  const t=todayStr();
  let pool=state.chunks.filter(c=>c.status!=="已掌握"&&c.nextReview&&c.nextReview<=t);
  if(!pool.length)pool=state.chunks.filter(c=>c.status!=="已掌握");
  if(!pool.length)pool=state.chunks;
  return pool[Math.floor(Math.random()*pool.length)];
}
function openRandomReview(){
  const c=pickRandomChunk(); if(!c)return;
  showRandomChunk(c.id);
}
function showRandomChunk(id){
  const c=state.chunks.find(x=>x.id===id); if(!c)return;
  const statuses=["未学","学习中","已掌握"];
  openModal(`随机复习 · ${CHUNK_CAT_NAMES[c.cat]}`,`
    <p class="en-head en" style="font-size:20px;font-weight:700">${esc(c.en)}</p>
    <p>${esc(c.zh)}</p>
    <p class="muted en">Example: ${esc(c.example)}</p>
    <div class="status-row">
      ${statuses.map(s=>`<button class="${s==="已掌握"?"s-good":""} ${c.status===s?"active":""}"
        onclick="setChunkStatusFromModal('${c.id}','${s}')">${s}</button>`).join("")}
    </div>
    <div class="toolbar" style="margin-top:12px">
      <button onclick="reviewChunkFromModal('${c.id}')">完成本次复习</button>
      <button onclick="showRandomChunk(pickRandomChunk().id)">换一个</button>
    </div>
    <p class="hint">已复习 ${c.reviewCount} 次 ${c.nextReview?"｜下次复习 "+esc(c.nextReview):""}</p>`);
}
function setChunkStatusFromModal(id,status){setChunkStatus(id,status);showRandomChunk(id);}
function reviewChunkFromModal(id){reviewChunk(id);closeModal();}
function renderChunks(){
  const list=state.chunks.filter(c=>{
    if(chunkFilter!=="all"&&c.cat!==chunkFilter)return false;
    if(chunkSearch&&!(c.en.toLowerCase().includes(chunkSearch)||c.zh.toLowerCase().includes(chunkSearch)))return false;
    return true;
  });
  const mastered=masteredChunks().length;
  $("view-chunks").innerHTML=`
    <div class="section-title">词块学习 <span class="muted" style="font-size:14px">已掌握 ${mastered}/${state.chunks.length}</span></div>
    <div class="toolbar">
      <input type="search" placeholder="搜索英文或中文…" value="${esc(chunkSearch)}"
        oninput="setChunkSearch(this.value)"/>
      <button class="primary" onclick="openRandomReview()">随机抽词（R）</button>
    </div>
    <div class="filter-row">
      <button class="${chunkFilter==="all"?"active":""}" onclick="setChunkFilter('all')">全部</button>
      ${Object.keys(CHUNK_CAT_NAMES).map(k=>
        `<button class="${chunkFilter===k?"active":""}" onclick="setChunkFilter('${k}')">${CHUNK_CAT_NAMES[k]}</button>`).join("")}
    </div>
    <div class="grid cols-2">
      ${list.map(c=>`
        <div class="card chunk-card">
          <span class="badge cat">${CHUNK_CAT_NAMES[c.cat]}</span>
          ${c.nextReview&&c.nextReview<=todayStr()&&c.status!=="已掌握"?`<span class="badge" style="background:var(--warn-soft);color:var(--warn)">待复习</span>`:""}
          <p class="en-head en">${esc(c.en)}</p>
          <p>${esc(c.zh)}</p>
          <p class="muted en">Example: ${esc(c.example)}</p>
          <textarea placeholder="用这个词块写一个自己的英文句子…" oninput="saveChunkSentence('${c.id}',this.value)">${esc(c.sentence)}</textarea>
          <div class="status-row">
            ${["未学","学习中","已掌握"].map(s=>
              `<button class="${s==="已掌握"?"s-good":""} ${c.status===s?"active":""}"
                onclick="setChunkStatus('${c.id}','${s}')">${s}</button>`).join("")}
            <button onclick="reviewChunk('${c.id}')">复习 +1</button>
          </div>
          <p class="hint">复习 ${c.reviewCount} 次 ${c.nextReview?"｜下次复习 "+esc(c.nextReview):"｜间隔 1/3/7/14/30 天"}</p>
        </div>`).join("")}
    </div>
    ${list.length?"":`<p class="muted">没有符合条件的词块。</p>`}`;
}

   ================================================================ */
let sentenceChunkId=null;
function nextSentenceChunk(){
  const c=pickRandomChunk();
  sentenceChunkId=c.id; renderSentence();
}
function saveSentence(rating){
  const c=state.chunks.find(x=>x.id===sentenceChunkId); if(!c)return;
  const area=$("sentenceInput"); const text=area?area.value.trim():"";
  if(!text){toast("请先输入英文句子");return;}
  c.sentence=text;
  c.sentences.push({text,rating,date:todayStr()});
  if(c.status==="未学")c.status="学习中";
  saveState(); renderSentence(); toast("句子已保存（"+({1:"差",2:"一般",3:"好"}[rating])+"）");
}
function renderSentence(){
  if(!sentenceChunkId||!state.chunks.some(c=>c.id===sentenceChunkId)){
    sentenceChunkId=pickRandomChunk().id;
  }
  const c=state.chunks.find(x=>x.id===sentenceChunkId);
  $("view-sentence").innerHTML=`
    <div class="section-title">造句训练</div>
    <div class="card">
      <span class="badge cat">${CHUNK_CAT_NAMES[c.cat]}</span>
      <p class="en" style="font-size:20px;font-weight:700">${esc(c.en)}</p>
      <p>${esc(c.zh)}</p>
      <textarea id="sentenceInput" style="min-height:100px" placeholder="Type your English sentence here…">${esc(c.sentence)}</textarea>
      <div class="rate-row">
        <span class="muted">自评：</span>
        <button onclick="saveSentence(1)">差</button>
        <button onclick="saveSentence(2)">一般</button>
        <button onclick="saveSentence(3)">好</button>
        <button style="margin-left:auto" onclick="document.getElementById('refExample').style.display='block'">显示参考例句</button>
        <button class="primary" onclick="nextSentenceChunk()">换一个词块</button>
      </div>
      <p id="refExample" class="star-tips en" style="display:none;margin-top:12px">Reference: ${esc(c.example)}</p>
    </div>

      <h3>本词块历史造句（${c.sentences.length}）</h3>
      ${c.sentences.slice(-5).reverse().map(s=>
        `<p class="en">${esc(s.text)} <span class="badge">${{1:"差",2:"一般",3:"好"}[s.rating]}</span></p>`).join("")||'<p class="muted">还没有历史造句。</p>'}
    </div>`;

function startProjectTimer(){
  const btn=$("ptStart");
  if(projectTimerInt){clearInterval(projectTimerInt);projectTimerInt=null;btn.textContent="继续";return;}
  btn.textContent="暂停";
  projectTimerInt=setInterval(()=>{
    projectRemain--;
    const el=$("ptTime"); if(el)el.textContent=fmtClock(projectRemain);
    if(projectRemain<=0){
      clearInterval(projectTimerInt);projectTimerInt=null;
      if(btn)btn.textContent="开始";
      toast("2 分钟时间到"); beep();
    }
  },1000);
}
function resetProjectTimer(silent){
  clearInterval(projectTimerInt);projectTimerInt=null;projectRemain=120;
  const el=$("ptTime"); if(el)el.textContent="02:00";
  const btn=$("ptStart"); if(btn)btn.textContent="开始";
  if(!silent)toast("计时器已重置");
}
function saveProjectNotes(id,val){
  const p=state.projects.find(x=>x.id===id); if(!p)return;
  p.notes=val; saveState();
}
function setProjectScore(id,score){
  const p=state.projects.find(x=>x.id===id); if(!p)return;
  p.score=score; saveState(); openProject(id); toast("已保存自评："+score+" 分");
}
function beep(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.frequency.value=880;
    g.gain.setValueAtTime(.2,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6);
    o.start();o.stop(ac.currentTime+.6);
  }catch(e){}
}

  while(state.questions.length>1&&id===currentQid);
  return id;
}

  const btn=$("ivStart");
  if(ivInt){clearInterval(ivInt);ivInt=null;btn.textContent="开始计时";return;}
  btn.textContent="暂停";
  ivInt=setInterval(()=>{
    ivSec++;
    const el=$("ivTime"); if(el)el.textContent=fmtClock(ivSec);
  },1000);
}
function resetIVTimer(silent){
  clearInterval(ivInt);ivInt=null;ivSec=0;

function saveIVAnswer(id,val){

  const chunkPct=Math.round(masteredChunks().length/state.chunks.length*100);
  const qPracticedPct=Math.round(practicedQuestions().length/state.questions.length*100);
  const totalPractices=state.questions.reduce((s,q)=>s+q.practices.length,0);
  const sentencePct=Math.min(100,Math.round(totalSentences()/100*100));
  const planTotal=PLAN_QUARTERS.reduce((s,q)=>s+q.tasks.length,0);
  const planDone=PLAN_QUARTERS.reduce((s,q)=>s+q.tasks.filter(t=>state.plan[t.id]).length,0);
  const planPct=Math.round(planDone/planTotal*100);
  $("view-stats").innerHTML=`
    <div class="section-title">进度统计</div>
    <div class="stat-line" style="margin-bottom:18px">
      <div class="stat"><b>${state.checkins.length}</b><span class="muted">打卡天数</span></div>
      <div class="stat"><b>${state.streak}</b><span class="muted">连续打卡</span></div>
      <div class="stat"><b>${masteredChunks().length}</b><span class="muted">已掌握词块</span></div>
      <div class="stat"><b>${totalPractices}</b><span class="muted">面试作答总次数</span></div>
      <div class="stat"><b>${totalSentences()}</b><span class="muted">造句数量</span></div>
    </div>
    <div class="card">
      <h3>总体进度</h3>
      ${barRow("词块掌握比例",chunkPct,masteredChunks().length+"/"+state.chunks.length)}
      ${barRow("面试题练习比例",qPracticedPct,practicedQuestions().length+"/"+state.questions.length)}
      ${barRow("造句数量（/100）",sentencePct,totalSentences()+"")}
      ${barRow("周计划完成率",planPct,planDone+"/"+planTotal)}
    </div>
    <div class="card" style="margin-top:14px">
      <h3>词块分类掌握情况</h3>
      ${Object.keys(CHUNK_CAT_NAMES).map(k=>{
        const all=state.chunks.filter(c=>c.cat===k);
        const done=all.filter(c=>c.status==="已掌握").length;
        const pct=all.length?Math.round(done/all.length*100):0;
        return barRow(CHUNK_CAT_NAMES[k],pct,done+"/"+all.length);
      }).join("")}
    </div>
    <div class="card" style="margin-top:14px">
      <h3>面试题分类练习情况</h3>
      ${Object.keys(Q_CAT_NAMES).map(k=>{
        const all=state.questions.filter(q=>q.cat===k);
        const done=all.filter(q=>q.practices.length>0).length;
        const pct=all.length?Math.round(done/all.length*100):0;
        return barRow(Q_CAT_NAMES[k],pct,done+"/"+all.length);
      }).join("")}
    </div>`;
}

/* ================================================================
   十四、全局搜索
   ================================================================ */
let globalSearchTerm="";
function setGlobalSearch(v){globalSearchTerm=v.trim().toLowerCase();renderSearchResults();}
function renderSearchResults(){
  const kw=globalSearchTerm;
  const box=$("globalSearchResults");
  if(!kw){box.innerHTML='<p class="muted">输入关键词，可同时搜索词块、面试题、项目和答案库。</p>';return;}
  const chunks=state.chunks.filter(c=>c.en.toLowerCase().includes(kw)||c.zh.toLowerCase().includes(kw));
  const questions=state.questions.filter(q=>q.q.toLowerCase().includes(kw)||q.answer.toLowerCase().includes(kw));
  const projects=state.projects.filter(p=>p.name.toLowerCase().includes(kw)||
    p.template.toLowerCase().includes(kw)||p.keywords.join(" ").toLowerCase().includes(kw));
  const section=(title,items,render,onclickGo)=>`
    <h3 style="margin-top:16px">${title}（${items.length}）</h3>
    ${items.slice(0,20).map(x=>`<div class="search-result" onclick="${onclickGo}">${render(x)}</div>`).join("")
      ||'<p class="muted">无匹配结果。</p>'}`;
  box.innerHTML=
    section("词块",chunks,c=>
      `<p class="en" style="font-weight:600;margin:0">${esc(c.en)}</p><p class="muted" style="margin:0">${esc(c.zh)} ｜ ${CHUNK_CAT_NAMES[c.cat]} ｜ ${c.status}</p>`,
      "go('chunks')")+
    section("面试题 / 答案库",questions,q=>
      `<p class="en" style="font-weight:600;margin:0">${esc(q.q)}</p><p class="muted" style="margin:0">${Q_CAT_NAMES[q.cat]} ｜ 已练 ${q.practices.length} 次${q.answer?" ｜ 已有答案":""}</p>`,
      "go('answers')")+
    section("项目",projects,p=>
      `<p style="font-weight:600;margin:0">${esc(p.name)}</p><p class="muted" style="margin:0">${p.keywords.map(esc).join(" / ")}</p>`,
      "go('projects')");
}
function renderSearch(){
  $("view-search").innerHTML=`
    <div class="section-title">全局搜索</div>
    <input type="search" autofocus placeholder="搜索词块、面试题、项目、答案…" value="${esc(globalSearchTerm)}"
      oninput="setGlobalSearch(this.value)"/>
    <div id="globalSearchResults" style="margin-top:10px"></div>`;
  renderSearchResults();
}

/* ================================================================
   十五、深色模式
   ================================================================ */
function toggleTheme(){
  const dark=document.body.classList.toggle("dark");
  state.settings.theme=dark?"dark":"light";
  $("themeBtn").textContent=dark?"浅色模式":"深色模式";
  saveState();
}
function applyTheme(){
  const dark=state.settings.theme==="dark";
  document.body.classList.toggle("dark",dark);
  $("themeBtn").textContent=dark?"浅色模式":"深色模式";
}

/* ================================================================
   十六、导出 / 导入 / 重置
   ================================================================ */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="nuclear-cra-study-backup.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  toast("已导出备份文件");
}
function importData(event){
  const file=event.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||data.appId!==LS_KEY)throw new Error("文件格式不匹配");
      state=data; saveState(); applyTheme(); go("dashboard");
      toast("导入成功");
    }catch(e){toast("导入失败：文件格式不正确");}
  };
  reader.readAsText(file);
  event.target.value="";
}
function resetData(){
  if(!confirm("确定要清空全部学习数据并恢复初始内容吗？"))return;
  if(!confirm("再次确认：此操作不可恢复，建议先导出备份。"))return;
  localStorage.removeItem(LS_KEY);
  state=buildDefaultState(); saveState(); applyTheme(); go("dashboard");
  toast("数据已重置");
}

/* ================================================================
   十七、模态框
   ================================================================ */
function openModal(title,html){
  $("modalBox").innerHTML=
    `<div class="modal-head"><h3>${esc(title)}</h3>
       <button class="sm" onclick="closeModal()">关闭</button></div>${html}`;
  $("modalMask").classList.add("show");
}
function closeModal(){
  $("modalMask").classList.remove("show");
  clearInterval(projectTimerInt); projectTimerInt=null;
}

/* ================================================================
   十八、录音（MediaRecorder，可选能力）
   ================================================================ */
const Recorder={
  mediaRecorder:null,chunks:[],stream:null,
  get supported(){return !!(navigator.mediaDevices&&window.MediaRecorder);},
  get recording(){return !!(this.mediaRecorder&&this.mediaRecorder.state==="recording");},
  async start(){
    if(!this.supported)return false;
    this.chunks=[];
    this.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    this.mediaRecorder=new MediaRecorder(this.stream);
    this.mediaRecorder.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data);};
    this.mediaRecorder.start();
    return true;
  },
  stop(){
    return new Promise(resolve=>{
      if(!this.mediaRecorder){resolve(null);return;}
      this.mediaRecorder.onstop=()=>{
        const blob=new Blob(this.chunks,{type:"audio/webm"});
        const url=URL.createObjectURL(blob);
        if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;}
        this.mediaRecorder=null;
        resolve(url);
      };
      this.mediaRecorder.stop();
    });
  }
};
async function toggleRecording(btnEl,boxEl){
  if(!Recorder.supported){toast("当前浏览器不支持录音（需 HTTPS 或 localhost）");return;}
  try{
    if(Recorder.recording){
      const url=await Recorder.stop();
      btnEl.textContent=btnEl.id&&btnEl.id.indexOf("rec-")===0?"跟读录音":"录音";
      if(url)boxEl.innerHTML=`<audio controls src="${url}"></audio><p class="hint">录音仅本次浏览有效，不会保存。</p>`;
    }else{
      const ok=await Recorder.start();
      if(ok)btnEl.textContent="停止并回放";
      else toast("无法获取麦克风权限");
    }
  }catch(e){toast("录音失败："+e.message);}
}

/* ================================================================
   十九、键盘快捷键 & 初始化
   ================================================================ */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModal();return;}
  const tag=e.target.tagName;
  const typing=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||e.target.isContentEditable;
  if(typing)return;
  if(e.code==="Space"){e.preventDefault();checkin();}
  else if(e.key==="n"||e.key==="N"){go("interview");nextQuestion();}
  else if(e.key==="r"||e.key==="R"){openRandomReview();}
});

function init(){
  state=loadState();
  ensureDaily();
  applyTheme();
  renderDashboard();
  saveState();
}
init();
