# 核药CRA英文训练舱 - 每日 LLM 草稿生成工作流
# 每天 UTC 22:00（北京时间次日 06:00）运行，也支持手动触发 workflow_dispatch
# 生成的草稿写入 Supabase pending_updates 表，等待用户在「审核中心」人工审核
name: LLM Daily Drafts

on:
  schedule:
    - cron: '0 22 * * *'   # 每天 UTC 22:00
  workflow_dispatch: {}    # 支持 Actions 页面手动 Run workflow

jobs:
  llm-daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily LLM drafts into pending_updates
        run: python scripts/llm_daily_update.py
        env:
          # 全部来自 GitHub Secrets（Settings -> Secrets and variables -> Actions）
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # service_role key 只能放在 GitHub Secrets，绝对不能放前端
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
