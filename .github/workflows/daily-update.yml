# 核药CRA英文训练舱 - 每日数据更新工作流
# 每天 UTC 22:00（北京时间次日 06:00）运行，也支持手动触发
name: Daily Data Update

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install biopython feedparser requests beautifulsoup4 supabase

      - name: Fetch PubMed literature
        continue-on-error: true   # 双保险：单源失败不影响整体流程
        run: python scripts/fetch_pubmed.py
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Fetch ClinicalTrials.gov studies
        continue-on-error: true
        run: python scripts/fetch_trials.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Fetch regulation RSS
        continue-on-error: true
        run: python scripts/fetch_regulations.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Fetch PharmiWeb jobs
        continue-on-error: true
        run: python scripts/fetch_jobs.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
